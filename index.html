function startCoach(scope){clearInterval(coachTimer);coachStartedAt=Date.now();coachStage=0;const target=scope==='lesson'?'#lessonCoach':'#bankCoach';const getTip=()=>{if(scope==='lesson'&&currentLesson){const l=currentLesson;const tips={algorithm:'Transforme o enunciado em passos pequenos, como uma receita.',print:'Lembre: print mostra; o que está entre aspas é texto.',variables:'O sinal = guarda um valor. Leia da direita para a esquerda: o valor vai para a variável.',types:'Diferencie texto (str), inteiro (int), decimal (float) e verdadeiro/falso (bool).',input:'input recebe texto. Para somar um número digitado, pode ser necessário int(input(...)).',operators:'Observe o símbolo: + soma, * multiplica, / divide, // pega a parte inteira e % pega o resto.',if:'Avalie a condição como verdadeira ou falsa antes de escolher o bloco.',while:'Confira se a condição é verdadeira e se o contador muda dentro do laço.',for:'Descubra quantas voltas a sequência terá. Em range(n), o n não entra.',lists:'Lembre que os índices começam em zero.',methods:'Separe métodos de adicionar, remover, procurar e ordenar.',functions:'def define; a chamada executa; return devolve um valor.',strings:'Texto é sequência de caracteres. Confira índices e tamanho.',recursion:'Procure primeiro o caso base; depois identifique como o problema diminui.'};return tips[l.id]||'Leia a pergunta e compare cada alternativa com o exemplo da aula.'}return 'Tente destacar no enunciado o comando principal e eliminar as alternativas que fazem outra coisa.'};coachTimer=setInterval(()=>{if(!['lesson','bank'].includes(view))return;const elapsed=(Date.now()-coachStartedAt)/1000;const el=$(target);if(!el)return;if(elapsed>=35&&coachStage===0){coachStage=1;el.classList.remove('hidden');el.innerHTML='<strong>💡 Percebi que você está pensando há um tempinho.</strong>Não precisa correr. Dica inicial: '+esc(getTip())}else if(elapsed>=75&&coachStage===1){coachStage=2;el.classList.remove('hidden');el.innerHTML='<strong>🧩 Vamos dividir em partes?</strong>Primeiro descubra o que o enunciado está pedindo; depois acompanhe os valores linha por linha. Você também pode abrir o Tutor de dúvidas para explicar esse assunto de outro jeito.'}},5000)}
function renderQuestionBank(){bankBatchNumber=state.questionBatches[bankTopic]||0;const filtered=bankTopic==='all'?questionBank:questionBank.filter(q=>q.topic===bankTopic);const start=(bankBatchNumber*5)%filtered.length;bankBatch=Array.from({length:Math.min(5,filtered.length)},(_,i)=>filtered[(start+i)%filtered.length]);bankSelection={};bankChecked=false;app.innerHTML=`<div class="screen"><div class="eyebrow">Treino contínuo · questões que se renovam</div><h1>📝 Banco de questões</h1><p class="muted">Faça um lote de cinco questões. Quando terminar, toque em “Carregar próximas questões” para receber outro lote. As perguntas percorrem os assuntos da sua prova.</p><section class="card"><div class="bank-controls"><label for="bankTopic"><strong>Assunto:</strong></label><select id="bankTopic"><option value="all" ${bankTopic==='all'?'selected':''}>Todos os assuntos</option>${[...new Set(questionBank.map(q=>q.topic))].map(t=>`<option value="${esc(t)}" ${bankTopic===t?'selected':''}>${esc(t)}</option>`).join('')}</select><span class="topic-chip">Lote ${bankBatchNumber+1}</span></div><div class="progress" style="margin-top:12px"><span style="width:${Math.round(bankBatch.length/questionBank.length*100)}%"></span></div><p class="small muted" style="margin:7px 0 0">Banco com ${questionBank.length} questões autorais de revisão. As questões se repetem somente depois de percorrer o assunto.</p></section><div id="bankCoach" class="coach hidden" aria-live="polite"></div><div id="bankQuestions">${bankBatch.map((q,i)=>`<article class="bank-card" data-bank="${i}"><div class="eyebrow">Questão ${i+1} · ${esc(q.topic)}</div><h3>${esc(q.q)}</h3>${q.code?`<pre class="code">${esc(q.code)}</pre>`:''}<div class="options">${q.o.map((o,j)=>`<button class="opt" data-action="bank-choose" data-i="${i}" data-choice="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div><div class="feedback hidden" id="bankfb-${i}"></div></article>`).join('')}</div><div class="hero-actions"><button class="btn primary" id="bankCheck" data-action="bank-check">Corrigir minhas respostas</button><button class="btn outline" data-action="bank-next" id="bankNext" disabled>Carregar próximas questões →</button></div><div id="bankResult" class="callout hidden"></div></div></div>`;$('#bankTopic').addEventListener('change',e=>{bankTopic=e.target.value;state.questionBatches[bankTopic]=0;persist();renderQuestionBank()});startCoach('bank')}
function bankFinish(){if(bankChecked)return;if(Object.keys(bankSelection).length!==bankBatch.length){toast('Responda às cinco questões antes de corrigir.');return}let hits=0;bankChecked=true;bankBatch.forEach((q,i)=>{const ok=bankSelection[i]===q.a;if(ok){hits++;state.xp+=2}const fb=$(`#bankfb-${i}`);fb.className='feedback '+(ok?'good':'bad');fb.innerHTML=`${ok?'✅ Correto! ':'❌ Vamos entender. '} ${esc(q.e)}<br><strong>Dica:</strong> ${esc(q.h)}`;document.querySelectorAll(`[data-bank="${i}"] .opt`).forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===bankSelection[i]&&!ok)b.classList.add('wrong')})});state.questionStats=state.questionStats||{};state.questionStats[bankTopic]=(state.questionStats[bankTopic]||0)+hits;persist();$('#bankCheck').disabled=true;$('#bankNext').disabled=false;$('#bankResult').classList.remove('hidden');$('#bankResult').textContent=`Resultado: ${hits}/${bankBatch.length} corretas. ${hits===bankBatch.length?'Excelente!':'Leia com atenção as explicações das que errou.'} Quando terminar de revisar, carregue o próximo lote.`;$('#bankQuestions').scrollIntoView({behavior:'smooth',block:'start'})}
function tutorFormat(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function renderTutor(){app.innerHTML=`<div class="screen"><div class="eyebrow">Ajuda de estudos · tutor guiado</div><h1>🤖 Tutor de dúvidas</h1><p class="muted">Escreva sua dúvida como você falaria normalmente. O tutor reconhece os assuntos de Python do curso e explica com palavras simples e exemplos pequenos.</p><div class="callout yellow"><strong>Transparência:</strong> este tutor funciona offline com explicações e regras preparadas para suas aulas. Ele não é um modelo generativo conectado à internet e não consegue analisar fotos. Para uma dúvida muito específica ou uma foto do caderno, envie aqui na conversa do ChatGPT.</div><div class="tutor-grid"><section class="card"><h2>💬 Converse com o tutor</h2><div class="chatbox" id="tutorChat"><div class="chatmsg bot">Oi! Pode perguntar sem vergonha. Exemplos: “não entendi o while”, “qual a diferença entre print e return?” ou “me dá uma dica de listas”.</div>${tutorHistory.map(m=>`<div class="chatmsg ${m.role==='user'?'user':'bot'}">${tutorFormat(m.text)}</div>`).join('')}</div><textarea id="tutorQuestion" class="tutor-input" placeholder="Digite sua dúvida aqui..."></textarea><div class="hero-actions" style="margin-top:9px"><button class="btn primary" data-action="tutor-ask">Perguntar ao tutor</button><button class="btn outline" data-action="tutor-clear">Limpar conversa</button></div></section><section class="card"><h2>⚡ Perguntas rápidas</h2><p class="muted small">Toque em um assunto para receber uma explicação.</p><div class="quickprompts"><button data-action="tutor-prompt" data-prompt="Não entendi o print">O que é print?</button><button data-action="tutor-prompt" data-prompt="Não entendi variáveis">Variáveis</button><button data-action="tutor-prompt" data-prompt="Como funciona input e int?">input e int</button><button data-action="tutor-prompt" data-prompt="Como funciona if e else?">if e else</button><button data-action="tutor-prompt" data-prompt="Não entendi while">while</button><button data-action="tutor-prompt" data-prompt="Qual diferença de for e range?">for e range</button><button data-action="tutor-prompt" data-prompt="Não entendi listas e append">Listas</button><button data-action="tutor-prompt" data-prompt="Qual diferença entre print e return?">Funções e return</button><button data-action="tutor-prompt" data-prompt="Não entendi recursividade e caso base">Recursividade</button><button data-action="tutor-prompt" data-prompt="Como resolver média ponderada?">Média ponderada</button><button data-action="tutor-prompt" data-prompt="Não entendi busca binária">Busca binária</button><button data-action="tutor-prompt" data-prompt="Como fazer soma cumulativa?">Soma cumulativa</button><button data-action="tutor-prompt" data-prompt="Como intercalar duas listas?">Intercalar listas</button></div><div class="callout green" style="margin-top:14px"><strong>Como pedir uma boa dica</strong>Escreva o nome do comando, cole o código ou diga exatamente qual parte te confundiu. O tutor vai tentar direcionar a explicação.</div></section></div></div>`}
function tutorAnswer(raw){const q=raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,' ');const rules=[
[/busca bin[aá]ria|busca_binaria/,'Busca binária','A lista precisa estar ordenada. Mantenha inicio e fim. Calcule meio = (inicio + fim) // 2. Se lista[meio] for o alvo, retorne meio. Se o alvo for menor, diminua fim para meio - 1; se for maior, aumente inicio para meio + 1. O while termina quando inicio > fim; aí retorne -1.'],
[/m[eé]dia ponderada|media_ponderada/,'Média ponderada','Multiplique cada nota pelo peso correspondente e some esses resultados. Depois divida pela soma dos pesos. Exemplo: notas [8, 6], pesos [2, 1]: (8*2 + 6*1) / (2+1) = 22/3 = 7,33. Use duas listas e percorra os índices.'],
[/soma cumulativa|soma_cumulativa|prefixo/,'Soma cumulativa','Use um acumulador que começa em 0 e uma lista resultado vazia. Para cada número: acumulado += numero; depois resultado.append(acumulado). Exemplo: [2, 3, 4] vira [2, 5, 9].'],
[/intercal|rotacion|diferen[cç]a sim[eé]trica|frequ[eê]ncia|sublistas|achatar|permuta/,'Algoritmos com listas','Primeiro descubra se precisa percorrer uma ou duas listas, se precisa guardar resultados numa lista nova e se a ordem importa. Para intercalar, pegue itens alternados. Para frequência, mantenha itens únicos e contadores alinhados. Para sublistas contínuas, use dois índices (início e fim). Para achatar ou permutar, a lista de revisão pede recursividade.'],
[/produto escalar|calcular_produto|produto de uma lista/,'Produto de uma lista','Comece o acumulador em 1, não em 0, porque você vai multiplicar. Se a lista estiver vazia, o enunciado manda retornar 0. Para cada número: produto = produto * numero. No final, return produto.'],
[/recurs|fatorial|caso base|pilha de chamada/,'Recursividade','Uma função recursiva chama a si mesma. Ela precisa de um caso base, que é a condição de parada. No fatorial: `if n <= 1: return 1` para a sequência. Depois, o passo recursivo reduz o problema: `n * fatorial(n - 1)`. Exemplo: fatorial(3) = 3 × 2 × 1 = 6.'],
[/append|insert|extend|pop|remove|clear|sort|reverse|lista|índice|indice|slicing|count|index/,'Listas','Uma lista guarda vários valores: `frutas = ["maçã", "uva"]`. Os índices começam em zero: frutas[0] é "maçã". `append("pera")` adiciona no final; `pop()` remove o último; `remove("uva")` remove pelo valor; `len(frutas)` conta os itens. `sort()` ordena; `reverse()` apenas inverte a ordem atual.'],
[/return|def |fun[cç][aã]o|par[aâ]metro|argumento|chamad/,'Funções','`def` define a função, mas não a executa sozinho. A chamada, como `dobro(5)`, executa o bloco. O valor 5 é o argumento. `return` devolve o resultado para quem chamou. Exemplo: `def dobro(n): return n * 2`. `print()` mostra na tela; `return` devolve um valor.'],
[/while|la[cç]o|loop infinito/,'while','`while` significa “enquanto”. O bloco repete enquanto a condição for verdadeira. Exemplo: `contador = 1; while contador <= 3: print(contador); contador += 1`. Atualizar o contador é importante para a condição ficar falsa e o laço parar.'],
[/for|range/,'for e range','`for` percorre os itens de uma sequência. `range(3)` gera 0, 1 e 2 — o número final não entra. Exemplo: `for n in range(3): print(n)`. Use `for` quando você sabe qual sequência quer percorrer; `while` quando a repetição depende de uma condição.'],
[/print|mostrar na tela/,'print()','`print()` mostra algo na tela. Exemplo: `print("Olá")` mostra a palavra Olá. Também pode mostrar uma conta: `print(2 + 3)` mostra 5. Pense em print como a voz do programa.'],
[/vari[aá]vel|sinal de igual| atribui/,'Variáveis','Uma variável é como uma caixa com etiqueta. `idade = 18` guarda o número 18 na variável idade. O sinal `=` atribui/guarda; `==` compara se dois valores são iguais. Exemplo: `nome = "Ana"`.'],
[/input|int\(|float\(|str|tipo|texto/,'input e tipos','`input()` recebe o que a pessoa digita e devolve texto (`str`). Para fazer conta, converta quando for adequado: `idade = int(input("Idade: "))`. Tipos comuns: `int` inteiro, `float` decimal, `str` texto e `bool` verdadeiro/falso.'],
[/if|else|elif|condi[cç][aã]o|compara/,'if e else','`if` testa uma condição. Se for verdadeira, executa o bloco. `else` é o caminho alternativo quando a condição é falsa. Exemplo: `if nota >= 6: print("Passou") else: print("Revisar")`. Use `==` para comparar igualdade.'],
[/operador|soma|divis[aã]o|resto|m[eé]dia|conta/,'Operadores','Alguns operadores: `+` soma, `-` subtrai, `*` multiplica, `/` divide, `//` faz divisão inteira e `%` devolve o resto. Exemplo: `7 % 2` resulta em 1.'],
[/algoritmo|l[oó]gica|come[cç]ar|programar/,'Lógica e algoritmo','Algoritmo é uma sequência ordenada de passos para resolver um problema, como uma receita. Antes de programar, pense: 1) o que entra? 2) o que preciso fazer com esses dados? 3) qual resultado devo mostrar?']
];let match=rules.find(r=>r[0].test(q));if(match)return `**${match[1]}**\n\n${match[2]}\n\nQuer que eu monte uma questão bem fácil sobre isso?`;
if(/dica|ajuda|não entendi|nao entendi|confuso|trav/.test(q))return 'Vamos por partes: releia o enunciado e procure o comando principal. Depois acompanhe o valor de cada variável linha por linha. Você pode me dizer o nome do comando (por exemplo, `while`, `append` ou `return`) ou colar o trecho de código que travou. Assim consigo direcionar melhor a explicação.\n\nVocê não precisa resolver tudo de uma vez.';
return 'Quero te ajudar, mas essa pergunta ficou específica demais para minhas explicações offline. Cole o código ou diga qual assunto está estudando (variáveis, if, while, for, listas, funções ou recursividade). Para questões novas ou explicações que exijam análise livre, use também esta conversa do ChatGPT. Não vou inventar uma resposta quando não reconhecer o assunto.'}
function sendTutor(raw){const textq=(raw||'').trim();if(!textq){toast('Digite sua dúvida primeiro.');return}tutorHistory.push({role:'user',text:textq},{role:'bot',text:tutorAnswer(textq)});if(tutorHistory.length>20)tutorHistory=tutorHistory.slice(-20);renderTutor();const chat=$('#tutorChat');chat.scrollTop=chat.scrollHeight}
function renderNotebook(){app.innerHTML=`<div class="screen"><div class="eyebrow">Seu caderno · revisão com fotos</div><h1>📸 Enviar foto para correção</h1><p class="muted">Selecione fotos do caderno, veja se estão legíveis e prepare o pedido de correção. Você pode adicionar várias páginas e remover as que saíram ruins.</p><section class="card"><div class="upload-zone"><div style="font-size:35px">📷</div><h2>Adicione páginas do caderno</h2><p class="muted small">No celular, escolha a câmera ou a galeria. Prefira uma foto por página, com boa luz e texto nítido.</p><input id="notebookUpload" type="file" accept="image/*" capture="environment" multiple></div><div id="photoGrid" class="photo-grid">${notebookFiles.length?notebookFiles.map((f,i)=>`<article class="photo-card"><img src="${f.data}" alt="Prévia da página ${i+1}"><p>${esc(f.name)}</p><button class="btn danger" data-action="photo-remove" data-i="${i}">Remover</button></article>`).join(''):'<p class="muted small">Nenhuma foto selecionada ainda.</p>'}</div><div class="answerbox"><label for="notebookSubject"><strong>Qual matéria/assunto é?</strong></label><input id="notebookSubject" class="notebook-input" style="width:100%;margin-top:7px" placeholder="Ex.: Python — listas e funções"><label for="notebookNote" style="display:block;margin-top:12px"><strong>Algum detalhe para o corretor?</strong></label><textarea id="notebookNote" class="tutor-input" placeholder="Ex.: não entendi a questão 3; quero que explique passo a passo."></textarea></div><div class="hero-actions"><button class="btn primary" data-action="notebook-prompt" ${notebookFiles.length?'':'disabled'}>Preparar pedido de correção</button><button class="btn outline" data-action="notebook-clear">Limpar fotos</button></div><div id="notebookResult" class="callout hidden"></div></section><div class="disclaimer" style="margin-top:13px"><strong>Importante sobre a IA:</strong> esta página funciona localmente e não envia imagens para um serviço de IA. Ela permite selecionar e conferir as fotos, mas não consegue ler a escrita à mão nem corrigir a imagem sozinha. Para eu corrigir de verdade, anexe as mesmas fotos diretamente nesta conversa do ChatGPT. Eu posso transcrever, marcar erros, explicar o raciocínio e propor exercícios parecidos.</div></div>`}
function handleNotebookFiles(files){const incoming=Array.from(files||[]);if(notebookFiles.length+incoming.length>6){toast('Adicione no máximo 6 fotos por vez.');return}let pending=incoming.length;const finishOne=()=>{pending--;if(pending===0)renderNotebook()};incoming.forEach(file=>{if(!file.type.startsWith('image/')){finishOne();return}if(file.size>6*1024*1024){toast(file.name+' é maior que 6 MB.');finishOne();return}const reader=new FileReader();reader.onload=()=>{notebookFiles.push({name:file.name,data:reader.result});finishOne()};reader.onerror=()=>{finishOne();toast('Não consegui abrir '+file.name)};reader.readAsDataURL(file)});if(!incoming.length)renderNotebook()}
function notebookPrompt(){const subj=$('#notebookSubject')?.value||'Python / lógica de algoritmos';const note=$('#notebookNote')?.value||'Explique com bastante calma.';const prompt=`Corrija as fotos do meu caderno sobre ${subj}.\n\n1. Transcreva cada questão e minha resposta.\n2. Marque o que está certo e errado sem pular etapas.\n3. Explique cada erro com linguagem simples e passo a passo.\n4. Mostre uma resposta corrigida e um exemplo parecido.\n5. Não invente trechos ilegíveis: peça esclarecimento quando não conseguir ler.\n\nObservação: ${note}`;const box=$('#notebookResult');box.classList.remove('hidden');box.innerHTML=`<strong>Pedido preparado!</strong><p>As ${notebookFiles.length} foto(s) estão selecionadas nesta página. Copie o texto abaixo e, nesta conversa do ChatGPT, anexe as fotos da galeria/arquivos junto com o pedido.</p><textarea class="tutor-input" id="notebookPromptText">${esc(prompt)}</textarea><button class="btn primary" data-action="copy-notebook-prompt">Copiar pedido</button>`}

function renderMock(){mockSelection={};mockSubmitted=false;app.innerHTML=`<div class="screen"><div class="eyebrow">Treino para 28/11</div><h1>🏆 Simulado da prova</h1><p class="muted">12 perguntas misturadas. Responda primeiro; depois veja a correção e explicação.</p><div class="stats"><div class="stat"><strong>12</strong><span>questões</span></div><div class="stat"><strong>100%</strong><span>possível</span></div><div class="stat"><strong>${state.mockBest}%</strong><span>melhor nota</span></div><div class="stat"><strong>15 min</strong><span>tempo sugerido</span></div></div><div id="mockArea">${mockQs.map((q,i)=>`<article class="quiz" data-mock="${i}"><h3>Questão ${i+1}. ${q[0]}</h3><div class="options">${q[1].map((o,j)=>`<button class="opt" data-action="mock-choose" data-i="${i}" data-choice="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><div class="feedback hidden" id="mockfb-${i}"></div></article>`).join('')}<button class="btn primary" data-action="mock-finish">Corrigir simulado</button></div><div id="mockResult" class="callout hidden" style="margin-top:13px"></div></div>`}
function mockFinish(){if(Object.keys(mockSelection).length!==mockQs.length){toast('Responda às 12 questões para corrigir.');return}let hits=0;mockQs.forEach((q,i)=>{const ok=mockSelection[i]===q[2];if(ok)hits++;const fb=$(`#mockfb-${i}`);fb.className='feedback '+(ok?'good':'bad');fb.textContent=(ok?'✅ Correto. ':'❌ Resposta correta: '+q[1][q[2]]+'. ')+q[3];document.querySelectorAll(`[data-mock="${i}"] .opt`).forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');if(j===mockSelection[i]&&!ok)b.classList.add('wrong')})});const pct=Math.round(hits/mockQs.length*100);state.mockBest=Math.max(state.mockBest,pct);state.xp+=hits*2;persist();$('#mockResult').classList.remove('hidden');$('#mockResult').textContent=`Resultado: ${hits}/12 (${pct}%). ${pct>=80?'Ótimo trabalho!':'Revise as explicações das questões que errou. Você consegue melhorar praticando.'}`}
function renderSimulator(){app.innerHTML=`<div class="screen"><div class="eyebrow">Laboratório visual · funciona offline</div><h1>🧠 Entender o código passo a passo</h1><p class="muted">Escolha um exemplo e avance uma linha por vez. Aqui você acompanha o valor das variáveis como se estivesse dentro do computador.</p><section class="card"><div class="tabs"><button class="active" data-action="sim-select" data-example="variable">Variável</button><button data-action="sim-select" data-example="for">for</button><button data-action="sim-select" data-example="while">while</button><button data-action="sim-select" data-example="list">Lista</button><button data-action="sim-select" data-example="function">Função</button></div><div id="simContent"></div></section><div class="callout yellow">Este é um simulador didático de exemplos prontos: ele mostra a execução passo a passo. Não é um terminal que executa qualquer código digitado.</div></div>`;setSim('variable')}
const sims={variable:{title:'Rastreador de variável',code:['contador = 2','contador = contador + 3','contador = contador * 2','print(contador)'],steps:['A variável contador recebe 2.','Agora soma 3 ao valor atual: 2 + 3 = 5.','Multiplica o valor atual por 2: 5 × 2 = 10.','print mostra o valor final: 10.'],values:['contador ainda não existe','contador = 2','contador = 5','contador = 10','Saída na tela: 10']},for:{title:'Repetição com for',code:['for numero in range(1, 4):','    print(numero)'],steps:['range(1, 4) prepara os números 1, 2 e 3. O 4 fica de fora.','Primeira volta: numero vale 1; print mostra 1.','Segunda volta: numero vale 2; print mostra 2.','Terceira volta: numero vale 3; print mostra 3.','Não existem mais números na sequência. O for termina.'],values:['Aguardando começar','numero = 1 · saída 1','numero = 2 · saída 1, 2','numero = 3 · saída 1, 2, 3','Fim do laço · saída 1, 2, 3']},while:{title:'Repetição com while',code:['contador = 1','while contador <= 3:','    print(contador)','    contador = contador + 1'],steps:['contador recebe 1.','1 <= 3 é verdadeiro; o while entra.','Mostra 1 e aumenta contador para 2.','2 <= 3 é verdadeiro; mostra 2 e aumenta para 3.','3 <= 3 é verdadeiro; mostra 3 e aumenta para 4.','4 <= 3 é falso. O while para.'],values:['Aguardando começar','contador = 1','Saída 1 · contador = 2','Saída 1, 2 · contador = 3','Saída 1, 2, 3 · contador = 4','Fim · condição falsa']},list:{title:'Lista e índice',code:['frutas = ["maçã", "banana", "uva"]','print(frutas[0])','frutas.append("pera")','print(len(frutas))'],steps:['A variável frutas recebe três itens.','frutas[0] acessa o índice zero, que é maçã.','append adiciona pera no final. Agora há quatro itens.','len conta os elementos e mostra 4.'],values:['Lista criada com 3 itens','Saída: maçã','Lista: maçã, banana, uva, pera','Saída: 4']},function:{title:'Chamada de função',code:['def dobro(n):','    return n * 2','resultado = dobro(5)','print(resultado)'],steps:['def cria uma função chamada dobro. Ela recebe o parâmetro n.','return devolve n multiplicado por 2. A função foi definida, mas ainda não chamada.','dobro(5) chama a função. O argumento 5 entra no parâmetro n. A função devolve 10.','resultado guarda 10 e print mostra 10.'],values:['Função definida','A função aguarda chamada','resultado = 10','Saída: 10']}};
let simId='variable',simStep=0;function setSim(id){simId=id;simStep=0;document.querySelectorAll('[data-example]').forEach(b=>b.classList.toggle('active',b.dataset.example===id));renderSimContent()}
function renderSimContent(){const s=sims[simId];$('#simContent').innerHTML=`<h2>${s.title}</h2><pre class="code">${esc(s.code.join('\n'))}</pre><div class="callout green"><strong>Passo ${simStep}/${s.steps.length}</strong><br>${simStep===0?'Toque em “Próximo passo” para começar.':s.steps[simStep-1]}</div><div class="stepbox"><strong>O que sabemos agora:</strong>${s.values[Math.min(simStep,s.values.length-1)]}</div><div class="hero-actions"><button class="btn outline" data-action="sim-reset">↺ Reiniciar</button><button class="btn primary" data-action="sim-next" ${simStep>=s.steps.length?'disabled':''}>Próximo passo →</button></div>`}
function renderPlan(){const tasks=[['24/11','Entender funções sem medo','Treine def, parâmetros, chamada, print e return. Faça Funções 1, 2 e 3.'],['25/11','Listas, for, while e acumuladores','Faça Revisão P2 3, 5, 6, 9 e 10. Revise append, pop, len, index e slicing.'],['26/11','Recursividade por partes','Estude caso base, passo recursivo e pilha. Faça Recursividade extra 1, 5, 6, 8 e 9; depois P2 13 e 14.'],['27/11','Problemas misturados e simulado','Revise os erros. Tente média ponderada, busca binária e uma questão de lista. Pare para descansar antes da prova.']];app.innerHTML=`<div class="screen"><div class="eyebrow">Preparação até a prova</div><h1>📅 Plano de estudo</h1><p class="muted">Um roteiro sugerido para os dias que faltam até 28/11/2026. Pode adaptar sem culpa; o importante é praticar.</p><section class="card">${tasks.map((t,i)=>`<div class="dayrow"><div class="daybadge">${i+1}</div><div><strong>${t[0]} · ${t[1]}</strong><p>${t[2]}</p></div><span class="tag">${i===5?'Revisão':'Estudo'}</span></div>`).join('')}</section><div class="callout yellow">Sugestão de sessão curta: 15 minutos lendo e entendendo, 15 minutos de atividades e 5 minutos explicando em voz alta o que aprendeu.</div></div>`}
function renderProgress(){const total=lessons.reduce((n,l)=>n+l.questions.length,0);app.innerHTML=`<div class="screen"><div class="eyebrow">Seu esforço está contando</div><h1>📈 Meu progresso</h1><div class="stats"><div class="stat"><strong>${state.xp}</strong><span>⭐ XP acumulado</span></div><div class="stat"><strong>${state.correct.length}/${total}</strong><span>✅ questões corretas</span></div><div class="stat"><strong>${state.done.length}/${lessons.length}</strong><span>📚 aulas concluídas</span></div><div class="stat"><strong>${state.mockBest}%</strong><span>🏆 melhor simulado</span></div></div>${Object.entries(levels).map(([k,v])=>{const p=cardProgress(v.ids);return `<section class="card" style="margin:12px 0"><h3>${v.emoji} ${v.name}</h3><div class="progress"><span style="width:${p.pct}%"></span></div><div class="barline"><span>${p.done} de ${p.total} atividades</span><b>${p.pct}%</b></div></section>`}).join('')}<div class="callout green">Seu progresso fica salvo neste navegador neste aparelho. Se limpar os dados do navegador, o progresso pode ser apagado.</div><button class="btn danger" data-action="reset">Zerar meu progresso</button></div>`}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
if(a==='exam-open'){go('exam')}else if(a==='exam-group'){examGroup=b.dataset.group;renderExam()}else if(a==='exam-level'){examLevel=b.dataset.level;renderExam()}else if(a==='exam-done'){const id=b.dataset.id;state.examDone=state.examDone||[];if(state.examDone.includes(id)){state.examDone=state.examDone.filter(x=>x!==id)}else{state.examDone.push(id);state.xp+=5}persist();renderExam()}else if(a==='tutor-ask'){sendTutor($('#tutorQuestion')?.value||'')}else if(a==='tutor-prompt'){sendTutor(b.dataset.prompt)}else if(a==='tutor-clear'){tutorHistory=[];renderTutor()}else if(a==='bank-choose'){const i=Number(b.dataset.i);bankSelection[i]=Number(b.dataset.choice);document.querySelectorAll(`[data-bank=\"${i}\"] .opt`).forEach((x,j)=>x.classList.toggle('selected',j===bankSelection[i]))}else if(a==='bank-check'){bankFinish()}else if(a==='bank-next'){state.questionBatches[bankTopic]=(state.questionBatches[bankTopic]||0)+1;persist();renderQuestionBank()}else if(a==='photo-remove'){notebookFiles.splice(Number(b.dataset.i),1);renderNotebook()}else if(a==='notebook-clear'){notebookFiles=[];renderNotebook()}else if(a==='notebook-prompt'){notebookPrompt()}else if(a==='copy-notebook-prompt'){const t=$('#notebookPromptText');t.select();document.execCommand('copy');toast('Pedido copiado. Agora anexe as fotos nesta conversa.')}
else if(a==='start-zero'||a==='zero')go('zero');else if(a==='daily')go('daily');else if(a==='level'){const k=b.dataset.level;const ids=levels[k].ids;app.innerHTML=`<div class="screen"><button class="btn outline" data-action="levels">← Todos os níveis</button><div class="eyebrow">${levels[k].name}</div><h1>${levels[k].emoji} ${levels[k].name}</h1><p class="muted">${levels[k].desc}</p><div class="lesson-list">${ids.map((id,i)=>lessonRow(lessons.find(l=>l.id===id),i+1)).join('')}</div></div>`;view='levels';document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.view==='levels'))}
else if(a==='levels')go('levels');else if(a==='lesson')openLesson(b.dataset.id);else if(a==='back')go('zero');else if(a==='prev'){const all=levels.easy.ids.concat(levels.medium.ids,levels.hard.ids),i=all.indexOf(b.dataset.id);openLesson(all[Math.max(0,i-1)])}else if(a==='next'){const all=levels.easy.ids.concat(levels.medium.ids,levels.hard.ids),i=all.indexOf(b.dataset.id);openLesson(all[Math.min(i+1,all.length-1)])}
else if(a==='walk'){walkIndex=0;walk()}else if(a==='walk-next'){walkIndex=walkIndex>=currentLesson.walk.length-1?0:walkIndex+1;walk()}
else if(a==='choose')choose(b.dataset.key,Number(b.dataset.choice));else if(a==='check')check(b.dataset.key);else if(a==='finish')finishLesson(b.dataset.id)
else if(a==='daily-choose'){const i=Number(b.dataset.i),n=Number(b.dataset.choice);dailySelection[i]=n;const box=document.querySelector(`[data-daily="${i}"]`);box.querySelectorAll('.opt').forEach((x,j)=>x.classList.toggle('selected',j===n))}
else if(a==='daily-extra')dailyExtraCheck();else if(a==='daily-finish')dailyFinish();else if(a==='mock-choose'){const i=Number(b.dataset.i),n=Number(b.dataset.choice);mockSelection[i]=n;const box=document.querySelector(`[data-mock="${i}"]`);box.querySelectorAll('.opt').forEach((x,j)=>x.classList.toggle('selected',j===n))}
else if(a==='mock-finish')mockFinish();else if(a==='sim-select')setSim(b.dataset.example);else if(a==='sim-next'){simStep=Math.min(simStep+1,sims[simId].steps.length);renderSimContent()}else if(a==='sim-reset'){simStep=0;renderSimContent()}
else if(a==='reset'){if(confirm('Tem certeza de que deseja apagar todas as aulas concluídas, respostas e pontos?')){state={...defaultState};persist();renderProgress();toast('Progresso zerado. Você pode recomeçar.')}}
});
app.addEventListener('change',e=>{if(e.target&&e.target.id==='notebookUpload')handleNotebookFiles(e.target.files)});
app.addEventListener('toggle',e=>{const d=e.target;if(!d||!d.matches||!d.matches('details.exam-detail')||!d.open)return;const id=d.dataset.examId;const q=examExercises.find(x=>x.id===id);const box=document.getElementById('examAuto-'+id);if(!q||!box)return;setTimeout(()=>{if(!d.open||d.querySelector('.exam-solution[open]'))return;box.classList.remove('hidden');box.textContent='💡 Primeira dica: '+(q.steps[0]||'Separe o problema em entrada, processamento e resultado.');},35000);setTimeout(()=>{if(!d.open||d.querySelector('.exam-solution[open]'))return;box.classList.remove('hidden');box.textContent='🧩 Vamos dividir ainda mais: '+(q.steps[1]||q.note||'Faça apenas a primeira parte do problema e teste antes de continuar.');},75000);},true);
app.addEventListener('input',e=>{if(e.target&&e.target.id==='examSearch'){examSearch=e.target.value;const box=$('#examCards');if(box){const filtered=examExercises.filter(x=>(examGroup==='Todos'||x.group===examGroup)&&(examLevel==='Todos'||x.level===examLevel)&&(!examSearch||[x.title,x.ask,x.topic,x.source].join(' ').toLowerCase().includes(examSearch.toLowerCase())));box.innerHTML=filtered.map(examCard).join('')}}});
app.addEventListener('keydown',e=>{if(e.target&&e.target.id==='tutorQuestion'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendTutor(e.target.value)}});
persist();render();
</script>
