<script>

const $=s=>document.querySelector(s);
const app=$('#app');
const START='2026-11-24';
const lessons=[
{id:'algorithm',level:'easy',title:'O que é lógica e algoritmo?',subtitle:'Aprenda a pensar em passos antes de escrever código.',badge:'Base zero',source:false,icon:'🧩',explain:[
['Pense numa receita','Um algoritmo é uma sequência de passos para chegar a um resultado. Uma receita é um exemplo: pegar a panela, colocar água, ligar o fogo e esperar ferver. Se trocar a ordem, pode dar errado.'],
['O computador segue instruções','O computador não adivinha o que você quis dizer. Ele faz os passos que você escreveu, na ordem em que aparecem. Por isso, precisamos deixar as instruções claras.'],
['Problema → passos → resultado','Antes de programar, pergunte: o que eu quero resolver? Quais passos preciso seguir? Qual resultado espero ver?']
],code:'# Algoritmo para fazer um sanduíche\n# 1. Pegar duas fatias de pão\n# 2. Colocar o recheio\n# 3. Juntar as fatias\n# 4. Servir',walk:['O comentário começa com # e não é executado.','O passo 1 acontece primeiro.','Depois vem o recheio.','No fim, temos o sanduíche.'],questions:[
{q:'O que é um algoritmo?',o:['Uma sequência organizada de passos','Um tipo de computador','Um erro de Python'],a:0,e:'Algoritmo é um conjunto de passos em ordem para resolver um problema.'},
{q:'Por que a ordem dos passos importa?',o:['Porque o computador escolhe a ordem sozinho','Porque um passo pode depender do anterior','Porque a primeira linha nunca é lida'],a:1,e:'O computador segue as instruções na ordem escrita. Uma etapa pode precisar da informação criada antes.'}
]},
{id:'print',level:'easy',title:'Seu primeiro comando: print()',subtitle:'Mostre mensagens e resultados na tela.',badge:'Base zero',source:false,icon:'🖥️',explain:[
['O que print faz?','`print()` mostra uma informação na tela. É como pedir para o computador falar alguma coisa. O nome print fica em letras minúsculas e usamos parênteses.'],
['Texto precisa de aspas','Quando queremos mostrar palavras, colocamos o texto entre aspas. Pode usar aspas duplas ou simples, mas abra e feche corretamente.'],
['Também mostra contas','Você pode colocar uma conta dentro do print. O Python calcula primeiro e mostra o resultado.']
],code:'print("Olá, mundo!")\nprint("Estou aprendendo Python")\nprint(2 + 3)',walk:['print("Olá, mundo!") mostra a frase.','A segunda linha mostra outra frase.','Na terceira linha, Python calcula 2 + 3 e mostra 5.'],questions:[
{q:'Qual comando mostra algo na tela?',o:['input()','print()','return()'],a:1,e:'print() é usado para exibir uma mensagem ou resultado.'},
{q:'O que aparece na tela?',code:'print(4 + 3)',o:['4 + 3','7','43'],a:1,e:'O Python resolve a soma antes de mostrar o resultado.'}
]},
{id:'variables',level:'easy',title:'Variáveis: as caixinhas de informação',subtitle:'Guarde um valor para usar mais tarde.',badge:'Base zero',source:false,icon:'📦',explain:[
['O que é variável?','Imagine uma caixa com uma etiqueta. A etiqueta é o nome da variável e dentro da caixa fica o valor. Exemplo: `idade = 18` guarda o número 18 na caixa chamada idade.'],
['O sinal = significa guardar','Em Python, um sinal de igual sozinho atribui um valor. Leia `idade = 18` como: “guarde 18 dentro de idade”. Não é uma pergunta.'],
['A variável pode mudar','Se depois escrever `idade = 19`, o valor antigo é substituído pelo novo. A variável passa a guardar 19.']
],code:'nome = "Ana"\nidade = 18\nprint(nome)\nprint(idade)\nidade = 19\nprint(idade)',walk:['nome recebe o texto Ana.','idade recebe o número 18.','print(nome) mostra Ana.','print(idade) mostra 18.','idade passa a guardar 19; a última linha mostra 19.'],questions:[
{q:'O que faz o sinal = neste exemplo?',code:'pontos = 10',o:['Compara dois valores','Guarda 10 na variável pontos','Mostra 10 na tela'],a:1,e:'O sinal = atribui, ou seja, coloca um valor dentro de uma variável.'},
{q:'O que será mostrado?',code:'x = 5\nx = 8\nprint(x)',o:['5','8','13'],a:1,e:'A segunda atribuição troca o valor guardado em x. Portanto, x vale 8.'}
]},
{id:'types',level:'easy',title:'Tipos de dados: número ou texto?',subtitle:'Descubra o que cada valor representa.',badge:'Base zero',source:false,icon:'🔤',explain:[
['int: número inteiro','Números sem casas decimais, como 2, 18 e -5.'],
['float: número com decimal','Números com casas decimais, como 1.5 ou 9.90. Em Python usamos ponto, não vírgula.'],
['str e bool','`str` é texto entre aspas, como "Maria". `bool` é verdadeiro ou falso: `True` ou `False`, com a primeira letra maiúscula.']
],code:'idade = 18       # int\npreco = 9.5      # float\nnome = "Bia"     # str\naprovado = True  # bool\n\nprint(type(idade))\nprint(type(nome))',walk:['idade guarda um número inteiro.','preco guarda um número decimal.','nome guarda um texto.','aprovado guarda verdadeiro.','type() mostra o tipo do valor.'],questions:[
{q:'Qual é o tipo de "Python"?',o:['int','str','bool'],a:1,e:'O valor está entre aspas, então é um texto: str (string).'},
{q:'Qual valor é do tipo bool?',o:['18','"sim"','True'],a:2,e:'True e False são os dois valores booleanos.'}
]},
{id:'input',level:'easy',title:'input(): recebendo informações',subtitle:'Faça perguntas e receba respostas de quem usa o programa.',badge:'Base zero',source:false,icon:'⌨️',explain:[
['O que input faz?','`input()` pausa o programa e espera a pessoa digitar uma resposta. Essa resposta é recebida como texto.'],

{q:'Quanto vale fatorial(3)?',o:['3','5','6'],a:2,e:'3! = 3 × 2 × 1 = 6.'},
{q:'O que acontece na pilha de chamadas?',o:['As chamadas ficam esperando e depois retornam','O Python apaga todas as variáveis','O programa ordena uma lista'],a:0,e:'Cada chamada espera a chamada menor terminar. Depois os resultados retornam de dentro para fora.'},

 é par quando a divisão por 2 deixa resto zero. O operador % pega o resto.", "steps": ["Receba numero como parâmetro.", "Teste numero % 2 == 0.", "Retorne True quando a condição for verdadeira; caso contrário, False."], "starter": "def verifica_par(numero):\n    if ...:\n        return True\n    else:\n        return False", "solution": "def verifica_par(numero):\n    if numero % 2 == 0:\n        return True\n    else:\n        return False", "test": "(verifica_par(8), verifica_par(5))", "expected": "(True, False)", "note": "Também seria válido escrever return numero % 2 == 0."}, {"id": "f04", "source": "PDF · Exercícios de Python sobre Funções", "group": "Funções", "num": 4, "title": "Fatorial", "level": "Médio", "topic": "laços", "ask": "Crie fatorial(n), para inteiro não negativo. O fatorial de 0 é 1.", "understand": "Fatorial multiplica n por todos os inteiros positivos menores até 1. Exemplo: 4! = 4 × 3 × 2 × 1.", "steps": ["Comece resultado = 1.", "Repita de 1 até n usando for e range.", "Multiplique resultado pelo número da vez.", "Retorne resultado."], "starter": "def fatorial(n):\n    resultado = 1\n    for numero in range(...):\n        resultado = ...\n    return resultado", "solution": "def fatorial(n):\n    resultado = 1\n    for numero in range(1, n + 1):\n        resultado = resultado * numero\n    return resultado", "test": "(fatorial(4), fatorial(0))", "expected": "(24, 1)", "note": "Na Aula 13 também aparece a versão recursiva: if n <= 1: return 1; return n * fatorial(n - 1)."}, {"id": "f05", "source": "PDF · Exercícios de Python sobre Funções", "group": "Funções", "num": 5, "title": "Números primos", "level": "Médio", "topic": "laços", "ask": "Crie eh_primo(n), que retorna True se n for primo e False caso contrário.", "understand": "Primo é maior que 1 e só pode ser dividido exatamente por 1 e por ele mesmo.", "steps": ["Se n for menor que 2, retorne False.", "Teste divisores começando em 2.", "Se n % divisor == 0, encontrou divisão exata: retorne False.", "Se nenhum divisor funcionar, retorne True."], "starter": "def eh_primo(n):\n    if n < 2:\n        return False\n    for divisor in range(2, n):\n        # teste se divide sem resto\n    return True", "solution": "def eh_primo(n):\n    if n < 2:\n        return False\n    for divisor in range(2, n):\n        if n % divisor == 0:\n            return False\n    return True", "test": "(eh_primo(7), eh_primo(9))", "expected": "(True, False)", "note": "Versão simples para aprender a lógica. Depois é possível otimizar testando divisores só até a raiz quadrada."}, {"id": "f06", "source": "PDF · Exercícios de Python sobre Funções", "group": "Funções", "num": 6, "title": "Contagem de vogais", "level": "Médio", "topic": "strings e laços", "ask": "Crie conta_vogais(texto), que retorna quantas vogais a, e, i, o, u aparecem.", "understand": "Percorra o texto letra por letra e mantenha um contador que aumenta quando achar vogal.", "steps": ["Comece quantidade = 0.", "Use for para percorrer cada letra.", "Transforme a letra em minúscula com lower().", "Se estiver em \"aeiou\", some 1.", "Retorne quantidade."], "starter": "def conta_vogais(texto):\n    quantidade = 0\n    for letra in texto:\n        if ...:\n            quantidade = quantidade + 1\n    return quantidade", "solution": "def conta_vogais(texto):\n    quantidade = 0\n    for letra in texto.lower():\n        if letra in \"aeiou\":\n            quantidade = quantidade + 1\n    return quantidade", "test": "conta_vogais(\"Banana\")", "expected": "3", "note": "O lower() faz A virar a, para contar maiúsculas e minúsculas do mesmo jeito."}, {"id": "f07", "source": "PDF · Exercícios de Python sobre Funções", "group": "Funções", "num": 7, "title": "Sequência de Fibonacci", "level": "Médio", "topic": "listas e laços", "ask": "Crie fibonacci(n), que retorna uma lista com os n primeiros números da sequência de Fibonacci.", "understand": "A sequência começa 0, 1. Cada próximo número é a soma dos dois anteriores.", "steps": ["Se n for 0, retorne lista vazia.", "Comece a lista com 0 e 1.", "A cada volta, some os dois últimos valores.", "Pare quando tiver n elementos e devolva somente n itens."], "starter": "def fibonacci(n):\n    if n <= 0:\n        return []\n    sequencia = [0, 1]\n    for i in range(2, n):\n        # some os dois últimos\n    return sequencia[:n]", "solution": "def fibonacci(n):\n    if n <= 0:\n        return []\n    if n == 1:\n        return [0]\n    sequencia = [0, 1]\n    for i in range(2, n):\n        proximo = sequencia[-1] + sequencia[-2]\n        sequencia.append(proximo)\n    return sequencia[:n]", "test": "fibonacci(6)", "expected": "[0, 1, 1, 2, 3, 5]", "note": "O índice -1 representa o último item e -2 o penúltimo."}, {"id": "f08", "source": "PDF · Exercícios de Python sobre Funções", "group": "Funções", "num": 8, "title": "Ordenação sem sort", "level": "Difícil", "topic": "listas e algoritmos", "ask": "Crie ordenar_lista(lista), que devolve os números em ordem crescente sem usar sort() ou sorted().", "understand": "Você precisa comparar valores e trocar de posição quando um número maior estiver antes de um menor.", "steps": ["Faça uma cópia da lista para não alterar a original.", "Use dois for para comparar pares vizinhos.", "Se o item atual for maior que o próximo, troque os dois.", "Repita as passagens até ordenar."], "starter": "def ordenar_lista(lista):\n    resultado = lista.copy()\n    for i in range(len(resultado)):\n        for j in range(0, len(resultado) - 1 - i):\n            if resultado[j] > resultado[j + 1]:\n                # troque os valores\n    return resultado", "solution": "def ordenar_lista(lista):\n    resultado = lista.copy()\n    for i in range(len(resultado)):\n        for j in range(0, len(resultado) - 1 - i):\n            if resultado[j] > resultado[j + 1]:\n                resultado[j], resultado[j + 1] = resultado[j + 1], resultado[j]\n    return resultado", "test": "ordenar_lista([4, 1, 3, 2])", "expected": "[1, 2, 3, 4]", "note": "Esse método é uma forma simples de Bubble Sort. Aprenda a comparação e a troca antes de decorar o algoritmo."}, {"id": "f09", "source": "PDF · Exercícios de Python sobre Funções", "group": "Funções", "num": 9, "title": "Palíndromo", "level": "Médio", "topic": "strings", "ask": "Crie eh_palindromo(texto), ignorando espaços e diferenças entre maiúsculas e minúsculas.", "understand": "Palíndromo é um texto que fica igual quando lido de trás para frente. Primeiro normalize o texto, depois compare.", "steps": ["Use lower() para deixar tudo minúsculo.", "Use replace(\" \", \"\") para remover espaços.", "Compare o texto com o texto invertido usando [::-1].", "Retorne o resultado da comparação."], "starter": "def eh_palindromo(texto):\n    texto = texto.lower().replace(\" \", \"\")\n    return ...", "solution": "def eh_palindromo(texto):\n    texto = texto.lower().replace(\" \", \"\")\n    return texto == texto[::-1]", "test": "eh_palindromo(\"Ame a ema\")", "expected": "True", "note": "O exercício pede ignorar espaços e maiúsculas/minúsculas; não pede remover pontuação."}, {"id": "f10", "source": "PDF · Exercícios de Python sobre Funções", "group": "Funções", "num": 10, "title": "Contagem de palavras", "level": "Difícil", "topic": "dicionários e strings", "ask": "Crie conta_palavras(texto), que devolve um dicionário com a quantidade de cada palavra separada por espaços.", "understand": "Dicionário guarda pares chave: valor. Aqui a palavra é a chave e a quantidade é o valor.", "steps": ["Crie contagem = {}.", "Separe o texto em palavras com split().", "Para cada palavra, se ela já existir, aumente 1. Se não existir, comece em 1.", "Retorne o dicionário."], "starter": "def conta_palavras(texto):\n    contagem = {}\n    for palavra in texto.split():\n        if palavra in contagem:\n            contagem[palavra] = ...\n        else:\n            contagem[palavra] = ...\n    return contagem", "solution": "def conta_palavras(texto):\n    contagem = {}\n    for palavra in texto.split():\n        if palavra in contagem:\n            contagem[palavra] = contagem[palavra] + 1\n        else:\n            contagem[palavra] = 1\n    return contagem", "test": "conta_palavras(\"oi tchau oi\")", "expected": "{\"oi\": 2, \"tchau\": 1}", "note": "Dicionários não foram explicados nas imagens iniciais; trate como conteúdo complementar do PDF."}, {"id": "f11", "source": "PDF · Exercícios de Python sobre Funções", "group": "Funções", "num": 11, "title": "Área do círculo", "level": "Fácil", "topic": "funções e matemática", "ask": "Crie area_circulo(raio), retornando pi vezes o raio ao quadrado.", "understand": "A fórmula é área = π × raio². Em Python, multiplicar por si mesmo é raio * raio.", "steps": ["Receba raio.", "Use math.pi para o valor de pi (importe math).", "Multiplique math.pi * raio * raio.", "Retorne o resultado."], "starter": "import math\ndef area_circulo(raio):\n    return ...", "solution": "import math\ndef area_circulo(raio):\n    return math.pi * raio ** 2", "test": "round(area_circulo(1), 2)", "expected": "3.14 (aproximadamente)", "note": "O operador ** significa potência: raio ** 2 é raio elevado ao quadrado."}, {"id": "f12", "source": "PDF · Exercícios de Python sobre Funções", "group": "Funções", "num": 12, "title": "Potência", "level": "Fácil", "topic": "operadores", "ask": "Crie potencia(base, expoente), que retorna base elevada ao expoente.", "understand": "O operador ** calcula potência. Para expoente 3, por exemplo, base ** 3.", "steps": ["Receba base e expoente.", "Calcule base ** expoente.", "Retorne o resultado."], "starter": "def potencia(base, expoente):\n    return ...", "solution": "def potencia(base, expoente):\n    return base ** expoente", "test": "potencia(2, 4)", "expected": "16", "note": "A lista recursiva do professor também tem uma potência recursiva: veja Recursão extra #4."}, {"id": "f13", "source": "PDF · Exercícios de Python sobre Funções", "group": "Funções", "num": 13, "title": "Comprimento de texto", "level": "Fácil", "topic": "strings", "ask": "Crie comprimento_string(texto), que retorna o comprimento da string.", "understand": "len() conta quantos caracteres existem no texto, incluindo espaços.", "steps": ["Receba texto.", "Use len(texto).", "Retorne o número."], "starter": "def comprimento_string(texto):\n    return ...", "solution": "def comprimento_string(texto):\n    return len(texto)", "test": "comprimento_string(\"Python\")", "expected": "6", "note": "A revisão da P2 também pede contar tamanho de uma lista sem len(), mas este exercício não proíbe len()."}, {"id": "f14", "source": "PDF · Exercícios de Python sobre Funções", "group": "Funções", "num": 14, "title": "Raiz quadrada", "level": "Fácil", "topic": "biblioteca math", "ask": "Crie raiz_quadrada(numero), usando math.sqrt().", "understand": "sqrt significa square root: raiz quadrada. É necessário importar o módulo math.", "steps": ["Escreva import math no começo.", "Receba numero.", "Retorne math.sqrt(numero)."], "starter": "import math\ndef raiz_quadrada(numero):\n    return ...", "solution": "import math\ndef raiz_quadrada(numero):\n    return math.sqrt(numero)", "test": "raiz_quadrada(49)", "expected": "7.0", "note": "O PDF não descreve o que fazer com números negativos; math.sqrt de número negativo comum gera erro."}, {"id": "f15", "source": "PDF · Exercícios de Python sobre Funções", "group": "Funções", "num": 15, "title": "Lista de números pares", "level": "Médio", "topic": "listas e condições", "ask": "Crie lista_pares(lista), retornando uma nova lista só com números pares.", "understand": "Percorra os números. Se o resto da divisão por 2 for zero, coloque o número na lista nova.", "steps": ["Crie pares = [].", "Percorra cada numero da lista.", "Se numero % 2 == 0, use append().", "Retorne pares."], "starter": "def lista_pares(lista):\n    pares = []\n    for numero in lista:\n        if ...:\n            pares.append(numero)\n    return pares", "solution": "def lista_pares(lista):\n    pares = []\n    for numero in lista:\n        if numero % 2 == 0:\n            pares.append(numero)\n    return pares", "test": "lista_pares([1, 2, 3, 4, 6])", "expected": "[2, 4, 6]", "note": "A lista original continua igual porque estamos montando uma nova lista."}, {"id": "f16", "source": "PDF · Exercícios de Python sobre Funções", "group": "Funções", "num": 16, "title": "Inverter string", "level": "Fácil", "topic": "strings e slicing", "ask": "Crie inverter_string(texto), que retorna o texto invertido.", "understand": "O fatiamento [::-1] percorre a string de trás para frente.", "steps": ["Receba o texto.", "Use texto[::-1].", "Retorne o resultado."], "starter": "def inverter_string(texto):\n    return ...", "solution": "def inverter_string(texto):\n    return texto[::-1]", "test": "inverter_string(\"Python\")", "expected": "nohtyP", "note": "A Aula 13 também ensina a inversão recursiva de texto; aqui o PDF de funções pede apenas devolver o texto invertido."}, {"id": "f17", "source": "PDF · Exercícios de Python sobre Funções", "group": "Funções", "num": 17, "title": "Média aritmética", "level": "Médio", "topic": "listas e acumuladores", "ask": "Crie media(lista), que retorna a média dos números.", "understand": "Média é soma de todos os valores dividida pela quantidade de valores.", "steps": ["Some os elementos com sum().", "Conte os elementos com len().", "Divida soma por quantidade.", "Considere o caso de lista vazia para evitar divisão por zero."], "starter": "def media(lista):\n    if len(lista) == 0:\n        return 0\n    return ...", "solution": "def media(lista):\n    if len(lista) == 0:\n        return 0\n    return sum(lista) / len(lista)", "test": "media([6, 8, 10])", "expected": "8.0", "note": "Retornar 0 para lista vazia é uma escolha de proteção; o enunciado não especifica esse caso."}, {"id": "f18", "source": "PDF · Exercícios de Python sobre Funções", "group": "Funções", "num": 18, "title": "Números primos até N", "level": "Difícil", "topic": "listas e laços", "ask": "Crie numeros_primos_ate(n), retornando uma lista com todos os primos até n.", "understand": "Você pode reaproveitar a lógica de eh_primo: testar cada número de 2 até n.", "steps": ["Crie primos = [].", "Percorra candidatos de 2 até n inclusive.", "Para cada candidato, teste divisores de 2 até candidato - 1.", "Se nenhum dividir sem resto, adicione à lista.", "Retorne primos."], "starter": "def numeros_primos_ate(n):\n    primos = []\n    for candidato in range(2, n + 1):\n        eh_primo = True\n        for divisor in range(2, candidato):\n            if ...:\n                eh_primo = False\n                break\n        if eh_primo:\n            primos.append(candidato)\n    return primos", "solution": "def numeros_primos_ate(n):\n    primos = []\n    for candidato in range(2, n + 1):\n        eh_primo = True\n        for divisor in range(2, candidato):\n            if candidato % divisor == 0:\n                eh_primo = False\n                break\n        if eh_primo:\n            primos.append(candidato)\n    return primos", "test": "numeros_primos_ate(10)", "expected": "[2, 3, 5, 7]", "note": "Aqui aparecem laço dentro de laço, condição, break e lista: avance até estar confortável com cada um separadamente."}, {"id": "f19", "source": "PDF · Exercícios de Python sobre Funções", "group": "Funções", "num": 19, "title": "Substituir vogais", "level": "Médio", "topic": "strings e listas", "ask": "Crie substituir_vogais(texto, caractere), substituindo cada vogal pelo caractere fornecido.", "understand": "Monte um texto novo letra por letra. Se a letra for vogal, coloque o caractere substituto; se não, mantenha a letra.", "steps": ["Crie resultado = \"\".", "Percorra cada letra.", "Se letra.lower() estiver em \"aeiou\", acrescente caractere.", "Senão, acrescente a letra original.", "Retorne resultado."], "starter": "def substituir_vogais(texto, caractere):\n    resultado = \"\"\n    for letra in texto:\n        if ...:\n            resultado += ...\n        else:\n            resultado += ...\n    return resultado", "solution": "def substituir_vogais(texto, caractere):\n    resultado = \"\"\n    for letra in texto:\n        if letra.lower() in \"aeiou\":\n            resultado += caractere\n        else:\n            resultado += letra\n    return resultado", "test": "substituir_vogais(\"casa\", \"*\")", "expected": "c*s*", "note": "O += em texto significa juntar o texto novo ao final do que já existe."}, {"id": "f20", "source": "PDF · Exercícios de Python sobre Funções", "group": "Funções", "num": 20, "title": "Juntar listas sem duplicatas", "level": "Médio", "topic": "listas", "ask": "Crie juntar_listas(lista1, lista2), devolvendo todos os itens das duas listas sem repetição.", "understand": "Comece com uma lista vazia e só adicione o item se ele ainda não estiver no resultado.", "steps": ["Crie resultado = [].", "Percorra lista1 + lista2.", "Se item not in resultado, use append(item).", "Retorne resultado."], "starter": "def juntar_listas(lista1, lista2):\n    resultado = []\n    for item in lista1 + lista2:\n        if ...:\n            resultado.append(item)\n    return resultado", "solution": "def juntar_listas(lista1, lista2):\n    resultado = []\n    for item in lista1 + lista2:\n        if item not in resultado:\n            resultado.append(item)\n    return resultado", "test": "juntar_listas([1, 2, 2], [2, 3])", "expected": "[1, 2, 3]", "note": "Mantém a ordem da primeira vez em que cada item aparece."}, {"id": "p201", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 1, "title": "Produto escalar básico", "level": "Médio", "topic": "listas e acumuladores", "ask": "Crie calcular_produto(lista), multiplicando todos os elementos. Se a lista estiver vazia, retorne 0.", "understand": "É parecido com soma acumulada, mas o acumulador começa em 1 e multiplica cada número.", "steps": ["Se a lista estiver vazia, retorne 0.", "Crie produto = 1.", "Percorra a lista e atualize produto = produto * numero.", "Retorne produto."], "starter": "def calcular_produto(lista):\n    if lista == []:\n        return 0\n    produto = 1\n    for numero in lista:\n        produto = ...\n    return produto", "solution": "def calcular_produto(lista):\n    if lista == []:\n        return 0\n    produto = 1\n    for numero in lista:\n        produto = produto * numero\n    return produto", "test": "(calcular_produto([2, 3, 4]), calcular_produto([]))", "expected": "(24, 0)", "note": "Não comece produto em 0: qualquer número multiplicado por 0 continuaria 0."}, {"id": "p202", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 2, "title": "Intercalação simples", "level": "Médio", "topic": "listas e laços", "ask": "Crie intercalar_listas(a, b), misturando um item da primeira lista e um da segunda. O programa principal lê 4 números para cada lista.", "understand": "Você vai pegar os itens de mesmo índice alternadamente. As listas do enunciado têm quatro itens, mas uma solução segura também pode aceitar tamanhos diferentes.", "steps": ["Crie resultado = [].", "Percorra os índices até o tamanho da maior lista.", "Se existir item naquele índice na primeira lista, adicione.", "Faça o mesmo com a segunda.", "No programa principal, leia 4 valores para cada lista e chame a função."], "starter": "def intercalar_listas(a, b):\n    resultado = []\n    for i in range(max(len(a), len(b))):\n        if i < len(a):\n            resultado.append(...)\n        if i < len(b):\n            resultado.append(...)\n    return resultado", "solution": "def intercalar_listas(a, b):\n    resultado = []\n    for i in range(max(len(a), len(b))):\n        if i < len(a):\n            resultado.append(a[i])\n        if i < len(b):\n            resultado.append(b[i])\n    return resultado\n\na = [1, 3, 5, 7]\nb = [2, 4, 6, 8]\nprint(intercalar_listas(a, b))", "test": "intercalar_listas([1, 3, 5, 7], [2, 4, 6, 8])", "expected": "[1, 2, 3, 4, 5, 6, 7, 8]", "note": "O programa principal e a função são partes diferentes: a função resolve; o principal coleta dados e chama.", "main": "lista1 = []\nlista2 = []\n\nfor i in range(4):\n    numero = int(input(\"Número da primeira lista: \"))\n    lista1.append(numero)\n\nfor i in range(4):\n    numero = int(input(\"Número da segunda lista: \"))\n    lista2.append(numero)\n\nresultado = intercalar_listas(lista1, lista2)\nprint(resultado)"}, {"id": "p203", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 3, "title": "Filtro de positivos estritos", "level": "Fácil", "topic": "listas e condições", "ask": "Crie filtrar_positivos(lista), devolvendo apenas valores maiores que zero, mantendo a ordem.", "understand": "Positivo estrito quer dizer maior que zero. Zero não entra e negativos também não.", "steps": ["Crie uma lista vazia.", "Percorra cada valor.", "Se valor > 0, adicione ao resultado.", "Retorne o resultado."], "starter": "def filtrar_positivos(lista):\n    resultado = []\n    for valor in lista:\n        if ...:\n            resultado.append(valor)\n    return resultado", "solution": "def filtrar_positivos(lista):\n    resultado = []\n    for valor in lista:\n        if valor > 0:\n            resultado.append(valor)\n    return resultado", "test": "filtrar_positivos([-2, 0, 4, 7, -1])", "expected": "[4, 7]", "note": "O sinal > é importante: se usar >=, o zero entraria e estaria errado."}, {"id": "p204", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 4, "title": "Média ponderada manual", "level": "Difícil", "topic": "listas, laços e matemática", "ask": "Crie media_ponderada(notas, pesos). O programa principal pergunta quantas avaliações serão cadastradas, lê nota e peso e mostra a média.", "understand": "Cada nota é multiplicada pelo seu peso. Some esses produtos e divida pela soma dos pesos.", "steps": ["Crie soma_ponderada = 0 e soma_pesos = 0.", "Percorra os índices das notas.", "Some nota * peso ao primeiro acumulador.", "Some o peso ao segundo.", "Retorne soma_ponderada / soma_pesos.", "No principal, use input e listas para cadastrar os dados."], "starter": "def media_ponderada(notas, pesos):\n    soma_ponderada = 0\n    soma_pesos = 0\n    for i in range(len(notas)):\n        soma_ponderada += ...\n        soma_pesos += ...\n    return ...", "solution": "def media_ponderada(notas, pesos):\n    soma_ponderada = 0\n    soma_pesos = 0\n    for i in range(len(notas)):\n        soma_ponderada += notas[i] * pesos[i]\n        soma_pesos += pesos[i]\n    if soma_pesos == 0:\n        return 0\n    return soma_ponderada / soma_pesos", "test": "media_ponderada([8, 6], [2, 1])", "expected": "7.333... (22 dividido por 3)", "note": "A proteção para soma dos pesos igual a zero evita divisão por zero. O programa principal pode usar quantidade = int(input(...)).", "main": "quantidade = int(input(\"Quantas avaliações? \"))\nnotas = []\npesos = []\n\nfor i in range(quantidade):\n    nota = float(input(\"Digite a nota: \"))\n    peso = float(input(\"Digite o peso: \"))\n    notas.append(nota)\n    pesos.append(peso)\n\nmedia = media_ponderada(notas, pesos)\nprint(f\"Média final: {media:.2f}\")"}, {"id": "p205", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 5, "title": "Verificador de crescimento", "level": "Médio", "topic": "listas, laços e condições", "ask": "Crie esta_ordenada_crescente(lista), retornando True se todos os elementos estiverem estritamente crescentes; pare no primeiro erro.", "understand": "Estritamente crescente significa que cada número precisa ser maior que o anterior. Valores iguais não servem.", "steps": ["Percorra os índices de 0 até o penúltimo.", "Compare lista[i] com lista[i + 1].", "Se lista[i] >= lista[i + 1], retorne False imediatamente.", "Se terminar sem encontrar problema, retorne True."], "starter": "def esta_ordenada_crescente(lista):\n    for i in range(len(lista) - 1):\n        if ...:\n            return False\n    return True", "solution": "def esta_ordenada_crescente(lista):\n    for i in range(len(lista) - 1):\n        if lista[i] >= lista[i + 1]:\n            return False\n    return True", "test": "(esta_ordenada_crescente([1, 3, 5]), esta_ordenada_crescente([1, 3, 3]))", "expected": "(True, False)", "note": "O >= detecta tanto queda quanto igualdade. O return False interrompe a função no primeiro problema."}, {"id": "p206", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 6, "title": "Buscar última ocorrência", "level": "Médio", "topic": "listas e laços", "ask": "Crie buscar_ultima_ocorrencia(lista, alvo), retornando o índice da última ocorrência ou -1. O principal usa while até digitar \"fim\".", "understand": "Para achar a última posição, percorra a lista de trás para frente. Se encontrar o alvo, devolva o índice.", "steps": ["Comece no último índice: len(lista) - 1.", "Use while indice >= 0.", "Se lista[indice] == alvo, retorne indice.", "Diminua indice em 1.", "Se terminar, retorne -1."], "starter": "def buscar_ultima_ocorrencia(lista, alvo):\n    indice = len(lista) - 1\n    while indice >= 0:\n        if lista[indice] == alvo:\n            return indice\n        indice = ...\n    return -1", "solution": "def buscar_ultima_ocorrencia(lista, alvo):\n    indice = len(lista) - 1\n    while indice >= 0:\n        if lista[indice] == alvo:\n            return indice\n        indice -= 1\n    return -1", "test": "buscar_ultima_ocorrencia([4, 7, 4, 9], 4)", "expected": "2", "note": "No programa principal, leia texto primeiro; se for \"fim\", use break. Caso contrário, converta para int e adicione à lista.", "main": "numeros = []\nwhile True:\n    entrada = input(\"Digite um número ou fim: \")\n    if entrada.lower() == \"fim\":\n        break\n    numeros.append(int(entrada))\n\nalvo = int(input(\"Qual número deseja procurar? \"))\nposicao = buscar_ultima_ocorrencia(numeros, alvo)\nif posicao == -1:\n    print(\"Número não encontrado\")\nelse:\n    print(\"Última posição:\", posicao)"}, {"id": "p207", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 7, "title": "Diferença simétrica de listas", "level": "Difícil", "topic": "listas e condições", "ask": "Crie diferenca_simetrica(a, b), com itens que estão em uma lista, mas não nas duas.", "understand": "Um item entra no resultado se aparecer só em a ou só em b. Itens comuns às duas ficam de fora.", "steps": ["Crie resultado = [].", "Percorra a: adicione se o item não estiver em b.", "Percorra b: adicione se o item não estiver em a.", "Retorne resultado."], "starter": "def diferenca_simetrica(a, b):\n    resultado = []\n    for item in a:\n        if item not in b:\n            resultado.append(item)\n    for item in b:\n        if ...:\n            resultado.append(item)\n    return resultado", "solution": "def diferenca_simetrica(a, b):\n    resultado = []\n    for item in a:\n        if item not in b:\n            resultado.append(item)\n    for item in b:\n        if item not in a:\n            resultado.append(item)\n    return resultado", "test": "diferenca_simetrica([1, 2, 3], [3, 4])", "expected": "[1, 2, 4]", "note": "O enunciado garante que não há repetição dentro de cada lista."}, {"id": "p208", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 8, "title": "Rotação circular para a direita", "level": "Médio", "topic": "listas e slicing", "ask": "Crie rotacionar_lista(lista, k), deslocando os itens k posições para a direita. Os últimos voltam para o início.", "understand": "Separe o final da lista e coloque esse pedaço na frente. Se k for maior que o tamanho, reduza com módulo.", "steps": ["Se a lista estiver vazia, devolva [].", "Ajuste k com k % len(lista).", "Se k for zero, devolva uma cópia.", "Junte lista[-k:] com lista[:-k]."], "starter": "def rotacionar_lista(lista, k):\n    if len(lista) == 0:\n        return []\n    k = k % len(lista)\n    if k == 0:\n        return lista.copy()\n    return ...", "solution": "def rotacionar_lista(lista, k):\n    if len(lista) == 0:\n        return []\n    k = k % len(lista)\n    if k == 0:\n        return lista.copy()\n    return lista[-k:] + lista[:-k]", "test": "rotacionar_lista([1, 2, 3, 4, 5], 2)", "expected": "[4, 5, 1, 2, 3]", "note": "Atenção: k=0 precisa ser tratado antes, pois lista[-0:] significa a lista inteira.", "main": "entrada = input(\"Digite números separados por espaço: \")\nlista = [int(valor) for valor in entrada.split()]\nk = int(input(\"Quantas posições para a direita? \"))\nprint(rotacionar_lista(lista, k))"}, {"id": "p209", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 9, "title": "Frequência em duas listas", "level": "Médio", "topic": "listas", "ask": "Crie contar_frequencias(lista), retornando duas listas: itens únicos e quantidades correspondentes nos mesmos índices.", "understand": "A primeira lista guarda cada valor apenas uma vez. A segunda guarda quantas vezes ele apareceu.", "steps": ["Crie unicos = [] e frequencias = [].", "Percorra os itens originais.", "Se item já estiver em unicos, ache sua posição com index e aumente a frequência nessa posição.", "Se não estiver, adicione o item e frequência 1.", "Retorne as duas listas."], "starter": "def contar_frequencias(lista):\n    unicos = []\n    frequencias = []\n    for item in lista:\n        if item in unicos:\n            posicao = unicos.index(item)\n            frequencias[posicao] += 1\n        else:\n            unicos.append(item)\n            frequencias.append(...)\n    return unicos, frequencias", "solution": "def contar_frequencias(lista):\n    unicos = []\n    frequencias = []\n    for item in lista:\n        if item in unicos:\n            posicao = unicos.index(item)\n            frequencias[posicao] += 1\n        else:\n            unicos.append(item)\n            frequencias.append(1)\n    return unicos, frequencias", "test": "contar_frequencias([\"a\", \"b\", \"a\", \"c\", \"b\", \"a\"])", "expected": "([\"a\", \"b\", \"c\"], [3, 2, 1])", "note": "O mesmo índice relaciona o item com a sua quantidade: unicos[0] combina com frequencias[0]."}, {"id": "p210", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 10, "title": "Soma cumulativa (prefixo)", "level": "Médio", "topic": "listas e acumuladores", "ask": "Crie soma_cumulativa(lista), que devolve uma lista em que cada posição é a soma desde o início até aquela posição.", "understand": "Não é a soma total repetida. É um total que vai crescendo: [2, 3, 4] vira [2, 5, 9].", "steps": ["Comece acumulado = 0 e resultado = [].", "Percorra cada número.", "Some o número ao acumulado.", "Adicione o acumulado à lista resultado.", "Retorne resultado."], "starter": "def soma_cumulativa(lista):\n    acumulado = 0\n    resultado = []\n    for numero in lista:\n        acumulado = ...\n        resultado.append(...)\n    return resultado", "solution": "def soma_cumulativa(lista):\n    acumulado = 0\n    resultado = []\n    for numero in lista:\n        acumulado += numero\n        resultado.append(acumulado)\n    return resultado", "test": "soma_cumulativa([2, 3, 4])", "expected": "[2, 5, 9]", "note": "Esse é um exemplo clássico de acumulador: a variável guarda o resultado parcial a cada volta."}, {"id": "p211", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 11, "title": "Sublistas com soma específica", "level": "Difícil", "topic": "listas e laços aninhados", "ask": "Crie encontrar_sublistas(lista, alvo), imprimindo todas as sequências contínuas de números positivos cuja soma seja o alvo. O principal cadastra transações até 0.", "understand": "Sequência contínua significa que os números precisam estar lado a lado na lista, sem pular posições.", "steps": ["Escolha cada posição inicial.", "Comece soma = 0 e sublista vazia.", "Avance a partir daquela posição, somando e guardando os valores.", "Quando soma for alvo, imprima a sublista.", "Como os valores são positivos, se soma passar do alvo, pare aquele avanço."], "starter": "def encontrar_sublistas(lista, alvo):\n    for inicio in range(len(lista)):\n        soma = 0\n        sublista = []\n        for fim in range(inicio, len(lista)):\n            soma += ...\n            sublista.append(...)\n            if soma == alvo:\n                print(sublista)\n            if soma > alvo:\n                break", "solution": "def encontrar_sublistas(lista, alvo):\n    for inicio in range(len(lista)):\n        soma = 0\n        sublista = []\n        for fim in range(inicio, len(lista)):\n            soma += lista[fim]\n            sublista.append(lista[fim])\n            if soma == alvo:\n                print(sublista)\n            if soma > alvo:\n                break", "test": "encontrar_sublistas([2, 1, 3, 2], 4)", "expected": "[1, 3]", "note": "O enunciado informa que os números são inteiros positivos; isso permite parar quando a soma ultrapassa o alvo.", "main": "transacoes = []\nwhile True:\n    valor = int(input(\"Valor da transação (0 encerra): \"))\n    if valor == 0:\n        break\n    transacoes.append(valor)\n\nalvo = int(input(\"Valor para auditoria: \"))\nencontrar_sublistas(transacoes, alvo)"}, {"id": "p212", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 12, "title": "Busca binária iterativa", "level": "Difícil", "topic": "while e busca", "ask": "Crie busca_binaria(lista_ordenada, alvo), usando while e divisão pela metade. Retorne o índice ou -1.", "understand": "A lista precisa estar ordenada. Em vez de olhar um por um, veja o meio: se o alvo for menor, descarte a metade direita; se for maior, descarte a esquerda.", "steps": ["Defina inicio = 0 e fim = len(lista) - 1.", "Enquanto inicio <= fim, calcule meio.", "Se lista[meio] for o alvo, retorne meio.", "Se o alvo for menor, mova fim para meio - 1; senão mova inicio para meio + 1.", "Se o while terminar, retorne -1."], "starter": "def busca_binaria(lista, alvo):\n    inicio = 0\n    fim = len(lista) - 1\n    while inicio <= fim:\n        meio = (inicio + fim) // 2\n        if lista[meio] == alvo:\n            return meio\n        elif alvo < lista[meio]:\n            fim = ...\n        else:\n            inicio = ...\n    return -1", "solution": "def busca_binaria(lista, alvo):\n    inicio = 0\n    fim = len(lista) - 1\n    while inicio <= fim:\n        meio = (inicio + fim) // 2\n        if lista[meio] == alvo:\n            return meio\n        elif alvo < lista[meio]:\n            fim = meio - 1\n        else:\n            inicio = meio + 1\n    return -1", "test": "busca_binaria([2, 4, 6, 8, 10], 8)", "expected": "3", "note": "Se a lista não estiver ordenada, a lógica da busca binária pode falhar. O enunciado exige lista previamente ordenada."}, {"id": "p213", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 13, "title": "Soma recursiva da lista", "level": "Difícil", "topic": "recursividade", "ask": "Crie soma_recursiva(lista), somando todos os elementos usando apenas chamadas a si mesma, sem for ou while. O principal cadastra salários de 5 funcionários.", "understand": "Separe a lista em primeiro elemento e restante. Some o primeiro com a soma recursiva do restante.", "steps": ["Caso base: lista vazia retorna 0.", "Passo recursivo: lista[0] + soma_recursiva(lista[1:]).", "No programa principal, leia 5 salários para uma lista e chame a função."], "starter": "def soma_recursiva(lista):\n    if lista == []:\n        return 0\n    return lista[0] + ...", "solution": "def soma_recursiva(lista):\n    if lista == []:\n        return 0\n    return lista[0] + soma_recursiva(lista[1:])", "test": "soma_recursiva([10, 20, 30])", "expected": "60", "note": "Não use for ou while dentro da função recursiva: o enunciado proíbe. A chamada recursiva percorre o restante.", "main": "salarios = []\nfor i in range(5):\n    salario = float(input(\"Salário do funcionário: \"))\n    salarios.append(salario)\n\ntotal = soma_recursiva(salarios)\nprint(\"Folha total:\", total)"}, {"id": "p214", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 14, "title": "Inversão recursiva de lista", "level": "Difícil", "topic": "recursividade e listas", "ask": "Crie inverter_recursivo(lista), devolvendo uma nova lista na ordem inversa usando recursividade.", "understand": "Pegue o primeiro item, inverta recursivamente o restante e coloque o primeiro item no final.", "steps": ["Caso base: lista vazia devolve [].", "Inverta lista[1:] usando nova chamada.", "Junte a lista invertida com [lista[0]]."], "starter": "def inverter_recursivo(lista):\n    if lista == []:\n        return []\n    return inverter_recursivo(lista[1:]) + [...]", "solution": "def inverter_recursivo(lista):\n    if lista == []:\n        return []\n    return inverter_recursivo(lista[1:]) + [lista[0]]", "test": "inverter_recursivo([1, 2, 3])", "expected": "[3, 2, 1]", "note": "Os colchetes em [lista[0]] são importantes: transformam o elemento em uma lista para poder concatenar."}, {"id": "p215", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 15, "title": "Decimal para binário recursivo", "level": "Difícil", "topic": "recursividade e strings", "ask": "Crie decimal_para_binario(n), devolvendo uma string binária usando divisões sucessivas por 2. O principal repete com while True e encerra se receber número negativo.", "understand": "A cada chamada, divida n por 2. O resto (0 ou 1) vira o último dígito; a chamada menor resolve os dígitos anteriores.", "steps": ["Caso base: se n < 2, retorne str(n).", "Passo recursivo: decimal_para_binario(n // 2) + str(n % 2).", "No principal, leia um número; se for negativo, mostre encerramento e use break."], "starter": "def decimal_para_binario(n):\n    if n < 2:\n        return str(n)\n    return ... + str(n % 2)", "solution": "def decimal_para_binario(n):\n    if n < 2:\n        return str(n)\n    return decimal_para_binario(n // 2) + str(n % 2)", "test": "decimal_para_binario(10)", "expected": "\"1010\"", "note": "A função retorna texto porque a resposta é uma sequência de dígitos binários. O while True é do programa principal, não da função recursiva.", "main": "while True:\n    numero = int(input(\"Número decimal (negativo encerra): \"))\n    if numero < 0:\n        print(\"Encerrando...\")\n        break\n    print(decimal_para_binario(numero))"}, {"id": "p216", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 16, "title": "Multiplicação russa recursiva", "level": "Difícil", "topic": "recursividade e matemática", "ask": "Crie multiplicacao_russa(a, b): divida a por 2 usando divisão inteira, dobre b e some b somente quando a for ímpar.", "understand": "Cada chamada reduz a pela metade. Se a for ímpar, o b daquela linha entra na soma final.", "steps": ["Caso base: se a == 0, retorne 0.", "Se a for ímpar, some b ao resultado da próxima chamada.", "Se a for par, apenas faça a próxima chamada.", "Na próxima chamada use a // 2 e b * 2."], "starter": "def multiplicacao_russa(a, b):\n    if a == 0:\n        return 0\n    if a % 2 == 1:\n        return b + multiplicacao_russa(..., ...)\n    return multiplicacao_russa(..., ...)", "solution": "def multiplicacao_russa(a, b):\n    if a == 0:\n        return 0\n    if a % 2 == 1:\n        return b + multiplicacao_russa(a // 2, b * 2)\n    return multiplicacao_russa(a // 2, b * 2)", "test": "multiplicacao_russa(13, 4)", "expected": "52", "note": "Esta versão segue o enunciado para números inteiros não negativos em a e b."}, {"id": "p217", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 17, "title": "Caminhos do robô em grid", "level": "Difícil", "topic": "recursividade", "ask": "Crie contar_caminhos(m, n), contando caminhos do canto superior esquerdo ao inferior direito, movendo apenas para direita ou para baixo.", "understand": "Para chegar ao destino, o último movimento veio de cima ou da esquerda. Por isso, some os caminhos dos dois tabuleiros menores.", "steps": ["Se m ou n for menor que 1, retorne 0.", "Se m == 1 ou n == 1, existe apenas um caminho: retorne 1.", "Caso contrário, some contar_caminhos(m - 1, n) e contar_caminhos(m, n - 1)."], "starter": "def contar_caminhos(m, n):\n    if m < 1 or n < 1:\n        return 0\n    if m == 1 or n == 1:\n        return 1\n    return ... + ...", "solution": "def contar_caminhos(m, n):\n    if m < 1 or n < 1:\n        return 0\n    if m == 1 or n == 1:\n        return 1\n    return contar_caminhos(m - 1, n) + contar_caminhos(m, n - 1)", "test": "contar_caminhos(2, 2)", "expected": "2", "note": "O exemplo usa contagem recursiva simples. Tabuleiros grandes podem gerar muitas chamadas repetidas.", "main": "linhas = int(input(\"Quantidade de linhas: \"))\ncolunas = int(input(\"Quantidade de colunas: \"))\ncaminhos = contar_caminhos(linhas, colunas)\nprint(f\"Para um grid {linhas}x{colunas}, há {caminhos} caminhos possíveis\")"}, {"id": "p218", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 18, "title": "Fusão de listas ordenadas", "level": "Difícil", "topic": "listas e while", "ask": "Crie mesclar_listas(a, b), recebendo duas listas crescentes e criando uma terceira lista também ordenada, usando laços.", "understand": "Compare o primeiro item ainda não usado de cada lista. Coloque o menor na lista final e avance naquela lista.", "steps": ["Crie índices i = 0 e j = 0.", "Enquanto ainda houver itens nas duas listas, compare a[i] e b[j].", "Adicione o menor e avance seu índice.", "Depois adicione os itens que sobraram de a ou b."], "starter": "def mesclar_listas(a, b):\n    i = 0\n    j = 0\n    resultado = []\n    while i < len(a) and j < len(b):\n        if a[i] <= b[j]:\n            resultado.append(a[i])\n            i += 1\n        else:\n            resultado.append(b[j])\n            j += 1\n    resultado.extend(a[i:])\n    resultado.extend(b[j:])\n    return resultado", "solution": "def mesclar_listas(a, b):\n    i = 0\n    j = 0\n    resultado = []\n    while i < len(a) and j < len(b):\n        if a[i] <= b[j]:\n            resultado.append(a[i])\n            i += 1\n        else:\n            resultado.append(b[j])\n            j += 1\n    resultado.extend(a[i:])\n    resultado.extend(b[j:])\n    return resultado", "test": "mesclar_listas([1, 4, 7], [2, 3, 8])", "expected": "[1, 2, 3, 4, 7, 8]", "note": "O enunciado pede laços e comparação dos cabeçalhos; extend() adiciona os elementos restantes."}, {"id": "p219", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 19, "title": "Achatar listas aninhadas", "level": "Difícil", "topic": "recursividade e listas", "ask": "Crie achatar_lista(lista), transformando listas com sublistas em uma única lista. Use type(elemento) is list para distinguir sublistas.", "understand": "Percorra cada elemento. Se for outra lista, achate essa lista recursivamente. Caso contrário, adicione o valor.", "steps": ["Crie resultado = [].", "Percorra cada elemento.", "Se type(elemento) is list, junte o resultado de achatar_lista(elemento).", "Senão, adicione o elemento.", "Retorne resultado."], "starter": "def achatar_lista(lista):\n    resultado = []\n    for elemento in lista:\n        if type(elemento) is list:\n            resultado.extend(...)\n        else:\n            resultado.append(elemento)\n    return resultado", "solution": "def achatar_lista(lista):\n    resultado = []\n    for elemento in lista:\n        if type(elemento) is list:\n            resultado.extend(achatar_lista(elemento))\n        else:\n            resultado.append(elemento)\n    return resultado", "test": "achatar_lista([1, [2, [3, 4]], 5])", "expected": "[1, 2, 3, 4, 5]", "note": "Aqui a função pode chamar a si mesma para cada sublista, inclusive em níveis mais profundos."}, {"id": "p220", "source": "PDF · Lista de Exercícios de Revisão para P2", "group": "Revisão P2", "num": 20, "title": "Gerador de permutações", "level": "Difícil", "topic": "recursividade e listas", "ask": "Crie gerar_permutacoes(lista), imprimindo todas as ordens possíveis dos elementos. O principal recebe palavra de 3 ou 4 letras distintas e transforma em lista.", "understand": "Escolha cada letra uma vez, junte com as letras restantes e continue até não sobrar nenhuma. Cada caminho completo é uma permutação.", "steps": ["Use um parâmetro extra prefixo, começando vazio.", "Caso base: quando lista estiver vazia, imprima prefixo.", "Para cada posição, escolha uma letra.", "Crie uma lista sem essa letra.", "Chame a função com o restante e prefixo + letra."], "starter": "def gerar_permutacoes(lista, prefixo=\"\"):\n    if lista == []:\n        print(prefixo)\n        return\n    for i in range(len(lista)):\n        letra = lista[i]\n        restante = lista[:i] + lista[i+1:]\n        gerar_permutacoes(..., ...)", "solution": "def gerar_permutacoes(lista, prefixo=\"\"):\n    if lista == []:\n        print(prefixo)\n        return\n    for i in range(len(lista)):\n        letra = lista[i]\n        restante = lista[:i] + lista[i+1:]\n        gerar_permutacoes(restante, prefixo + letra)", "test": "gerar_permutacoes([\"a\", \"b\", \"c\"])", "expected": "abc, acb, bac, bca, cab, cba (uma por linha)", "note": "O enunciado pede imprimir diretamente, então o caso base usa print(prefixo), não return de uma lista.", "main": "palavra = input(\"Digite uma palavra de 3 ou 4 letras distintas: \").strip()\nif len(palavra) not in (3, 4) or len(set(palavra)) != len(palavra):\n    print(\"Digite 3 ou 4 letras sem repetir\")\nelse:\n    gerar_permutacoes(list(palavra))"}, {"id": "r01", "source": "Captura · Lista de exercícios recursivos", "group": "Recursividade extra", "num": 1, "title": "Soma dos números até N", "level": "Médio", "topic": "recursividade", "ask": "Crie soma_ate(n), retornando 1 + 2 + ... + n.", "understand": "A soma de 5 é 5 + soma_ate(4). Reduza n até chegar a zero.", "steps": ["Caso base: se n == 0, retorne 0.", "Passo recursivo: retorne n + soma_ate(n - 1)."], "starter": "def soma_ate(n):\n    if n == 0:\n        return 0\n    return ...", "solution": "def soma_ate(n):\n    if n == 0:\n        return 0\n    return n + soma_ate(n - 1)", "test": "soma_ate(5)", "expected": "15", "note": "A cada chamada, n diminui 1 e se aproxima do caso base."}, {"id": "r02", "source": "Captura · Lista de exercícios recursivos", "group": "Recursividade extra", "num": 2, "title": "Contagem regressiva", "level": "Fácil", "topic": "recursividade e print", "ask": "Crie contagem_regressiva(n), imprimindo n, depois n-1, até imprimir zero e por fim \"Fim!\".", "understand": "A função mostra o número atual e chama a si mesma com um número menor. Quando passa de zero, imprime Fim!.", "steps": ["Se n < 0, imprima Fim! e pare.", "Caso contrário, imprima n.", "Chame contagem_regressiva(n - 1)."], "starter": "def contagem_regressiva(n):\n    if n < 0:\n        print(\"Fim!\")\n        return\n    print(n)\n    ...", "solution": "def contagem_regressiva(n):\n    if n < 0:\n        print(\"Fim!\")\n        return\n    print(n)\n    contagem_regressiva(n - 1)", "test": "contagem_regressiva(3)", "expected": "3, 2, 1, 0, Fim!", "note": "A imagem mostra a saída incluindo o zero. Por isso, a condição de parada é n < 0, depois que o zero foi impresso."}, {"id": "r03", "source": "Captura · Lista de exercícios recursivos", "group": "Recursividade extra", "num": 3, "title": "Multiplicação por somas sucessivas", "level": "Médio", "topic": "recursividade e operadores", "ask": "Crie multiplicar(a, b), calculando a × b usando apenas o operador de soma.", "understand": "Multiplicar por 4 é somar o mesmo número quatro vezes. Cada chamada reduz b em 1.", "steps": ["Caso base: se b == 0, retorne 0.", "Passo recursivo: retorne a + multiplicar(a, b - 1)."], "starter": "def multiplicar(a, b):\n    if b == 0:\n        return 0\n    return ...", "solution": "def multiplicar(a, b):\n    if b == 0:\n        return 0\n    return a + multiplicar(a, b - 1)", "test": "multiplicar(4, 3)", "expected": "12", "note": "A versão simples do exercício pressupõe b inteiro não negativo."}, {"id": "r04", "source": "Captura · Lista de exercícios recursivos", "group": "Recursividade extra", "num": 4, "title": "Potência recursiva", "level": "Médio", "topic": "recursividade e operadores", "ask": "Crie potencia(base, expoente), usando recursividade. O caso base é qualquer número elevado a zero igual a 1.", "understand": "2 elevado a 4 é 2 × 2 elevado a 3. O expoente diminui até zero.", "steps": ["Caso base: se expoente == 0, retorne 1.", "Passo recursivo: retorne base * potencia(base, expoente - 1)."], "starter": "def potencia(base, expoente):\n    if expoente == 0:\n        return 1\n    return ...", "solution": "def potencia(base, expoente):\n    if expoente == 0:\n        return 1\n    return base * potencia(base, expoente - 1)", "test": "potencia(2, 4)", "expected": "16", "note": "A atividade é descrita para expoentes não negativos."}, {"id": "r05", "source": "Captura · Lista de exercícios recursivos", "group": "Recursividade extra", "num": 5, "title": "Soma dos elementos de uma lista", "level": "Médio", "topic": "recursividade e listas", "ask": "Crie soma_lista(lista), somando os elementos sem laços, separando o primeiro item do restante.", "understand": "A soma da lista é o primeiro elemento mais a soma da lista sem esse primeiro elemento.", "steps": ["Caso base: lista vazia retorna 0.", "Passo recursivo: lista[0] + soma_lista(lista[1:])."], "starter": "def soma_lista(lista):\n    if lista == []:\n        return 0\n    return lista[0] + ...", "solution": "def soma_lista(lista):\n    if lista == []:\n        return 0\n    return lista[0] + soma_lista(lista[1:])", "test": "soma_lista([2, 4, 6, 8])", "expected": "20", "note": "lista[0] é o primeiro item; lista[1:] é a lista começando do segundo item."}, {"id": "r06", "source": "Captura · Lista de exercícios recursivos", "group": "Recursividade extra", "num": 6, "title": "Contar elementos sem len()", "level": "Médio", "topic": "recursividade e listas", "ask": "Crie tamanho_lista(lista), contando quantos elementos existem sem usar len().", "understand": "Se a lista está vazia, tem zero itens. Se tem pelo menos um, conte 1 e conte recursivamente o restante.", "steps": ["Caso base: lista vazia retorna 0.", "Passo recursivo: retorne 1 + tamanho_lista(lista[1:])."], "starter": "def tamanho_lista(lista):\n    if lista == []:\n        return 0\n    return 1 + ...", "solution": "def tamanho_lista(lista):\n    if lista == []:\n        return 0\n    return 1 + tamanho_lista(lista[1:])", "test": "tamanho_lista([\"a\", \"b\", \"c\", \"d\"])", "expected": "4", "note": "Não use len() dentro da função, porque o enunciado proíbe."}, {"id": "r07", "source": "Captura · Lista de exercícios recursivos", "group": "Recursividade extra", "num": 7, "title": "Contar ocorrências de uma letra", "level": "Médio", "topic": "recursividade e strings", "ask": "Crie contar_letra(texto, letra), retornando quantas vezes a letra aparece no texto.", "understand": "Olhe a primeira letra: some 1 se for igual à procurada e continue contando no restante do texto.", "steps": ["Caso base: texto vazio retorna 0.", "Crie 1 se texto[0] == letra, senão 0.", "Some esse valor com contar_letra(texto[1:], letra)."], "starter": "def contar_letra(texto, letra):\n    if texto == \"\":\n        return 0\n    if texto[0] == letra:\n        atual = 1\n    else:\n        atual = 0\n    return atual + ...", "solution": "def contar_letra(texto, letra):\n    if texto == \"\":\n        return 0\n    if texto[0] == letra:\n        atual = 1\n    else:\n        atual = 0\n    return atual + contar_letra(texto[1:], letra)", "test": "contar_letra(\"banana\", \"a\")", "expected": "3", "note": "Esta solução diferencia maiúsculas e minúsculas; a imagem não pede ignorar isso."}, {"id": "r08", "source": "Captura · Lista de exercícios recursivos", "group": "Recursividade extra", "num": 8, "title": "Procurar número na lista", "level": "Médio", "topic": "recursividade e listas", "ask": "Crie existe_na_lista(lista, alvo), retornando True se alvo estiver na lista e False caso contrário.", "understand": "Compare o primeiro elemento. Se não for ele, procure no restante com uma nova chamada.", "steps": ["Caso base: lista vazia retorna False.", "Se lista[0] == alvo, retorne True.", "Caso contrário, retorne existe_na_lista(lista[1:], alvo)."], "starter": "def existe_na_lista(lista, alvo):\n    if lista == []:\n        return False\n    if lista[0] == alvo:\n        return True\n    return ...", "solution": "def existe_na_lista(lista, alvo):\n    if lista == []:\n        return False\n    if lista[0] == alvo:\n        return True\n    return existe_na_lista(lista[1:], alvo)", "test": "existe_na_lista([10, 20, 30], 20)", "expected": "True", "note": "Cada chamada descarta o primeiro elemento que já foi verificado."}, {"id": "r09", "source": "Captura · Lista de exercícios recursivos", "group": "Recursividade extra", "num": 9, "title": "Verificar palíndromo recursivamente", "level": "Médio", "topic": "recursividade e strings", "ask": "Crie eh_palindromo(palavra) recursiva: compare primeira e última letra; se forem iguais, continue com o miolo.", "understand": "Se a palavra tiver zero ou uma letra, ela é palíndromo. Se as pontas forem diferentes, não é. Caso contrário, verifique o meio.", "steps": ["Caso base: len(palavra) <= 1 retorna True.", "Se primeira letra for diferente da última, retorne False.", "Chame a função com palavra[1:-1]."], "starter": "def eh_palindromo(palavra):\n    if len(palavra) <= 1:\n        return True\n    if palavra[0] != palavra[-1]:\n        return False\n    return ...", "solution": "def eh_palindromo(palavra):\n    if len(palavra) <= 1:\n        return True\n    if palavra[0] != palavra[-1]:\n        return False\n    return eh_palindromo(palavra[1:-1])", "test": "eh_palindromo(\"radar\")", "expected": "True", "note": "Nesta lista de exercícios, o exemplo é palavra simples. O PDF de funções pede ainda ignorar espaços e maiúsculas/minúsculas."}, {"id": "r10", "source": "Captura · Lista de exercícios recursivos", "group": "Recursividade extra", "num": 10, "title": "Imprimir lista de trás para frente", "level": "Médio", "topic": "recursividade e listas", "ask": "Crie imprimir_invertido(lista), imprimindo um item por linha de trás para frente. A chamada recursiva deve ocorrer antes do print.", "understand": "Vá até o fim da lista primeiro. Quando as chamadas retornarem, imprima os elementos na ordem inversa.", "steps": ["Caso base: lista vazia, simplesmente retorne.", "Chame imprimir_invertido(lista[1:]).", "Depois da chamada, imprima lista[0]."], "starter": "def imprimir_invertido(lista):\n    if lista == []:\n        return\n    imprimir_invertido(...)\n    print(...)", "solution": "def imprimir_invertido(lista):\n    if lista == []:\n        return\n    imprimir_invertido(lista[1:])\n    print(lista[0])", "test": "imprimir_invertido([1, 2, 3])", "expected": "3 depois 2 depois 1, cada um em uma linha", "note": "A ordem é o segredo: primeiro a chamada recursiva, depois o print. Se imprimir antes, sai na ordem original."}];

    <section class="card"><div class="eyebrow">Antes dos exercícios · a estrutura que mais importa</div><h2>Como ler qualquer questão de função</h2><p class="muted">Quase todos os exercícios de função podem ser separados nestas quatro partes:</p><div class="exam-guide"><div><b>1. def</b>Cria a função e dá um nome a ela.</div><div><b>2. Parâmetro</b>É a informação que a função recebe.</div><div><b>3. Corpo</b>São os passos que resolvem o problema.</div><div><b>4. return</b>Devolve o resultado para quem chamou.</div></div><pre class="exam-code">def soma(a, b):
    resultado = a + b
    return resultado

resposta = soma(3, 4)
print(resposta)  # 7</pre><div class="callout yellow"><b>Não confunda:</b> print() mostra na tela. return devolve um valor para o programa usar. Parâmetro é a variável que aparece na definição (a, b); argumento é o valor enviado na chamada (3, 4).</div></section>
    <section class="card" style="margin-top:13px"><div class="eyebrow">Revisão das aulas 10 e 11</div><h2>Referência rápida: métodos de lista</h2><p class="muted">Estes são os comandos que aparecem na captura da Aula 11. Índices começam em zero.</p><div class="list-reference">
      <div><b>Adicionar</b><p><code>append(item)</code> adiciona no final.</p><p><code>insert(i, item)</code> coloca em uma posição.</p><p><code>extend(outra)</code> acrescenta vários itens.</p></div>
      <div><b>Remover</b><p><code>pop(i)</code> remove e retorna pelo índice; sem índice, remove o último.</p><p><code>remove(item)</code> remove a primeira ocorrência.</p><p><code>clear()</code> esvazia a lista.</p></div>
      <div><b>Acessar e procurar</b><p><code>lista[i]</code> acessa índice; <code>lista[-1]</code> acessa o último.</p><p><code>index(item)</code> busca posição.</p><p><code>count(item)</code> conta ocorrências.</p></div>
      <div><b>Ordenar</b><p><code>sort()</code> crescente.</p><p><code>sort(reverse=True)</code> decrescente.</p><p><code>reverse()</code> inverte a ordem atual.</p></div>
      <div><b>Utilitários</b><p><code>len()</code> quantidade; <code>copy()</code> cópia.</p><p><code>min()</code> menor; <code>max()</code> maior.</p><p><code>sum()</code> soma dos números.</p></div>
      <div><b>Fatiamento</b><p><code>lista[inicio:fim]</code> cria sublista; fim não entra.</p><p><code>lista[::-1]</code> inverte por fatiamento.</p></div>
    </div><div class="callout green"><b>Por que listas aparecem tanto?</b> Pela captura da aula, listas são usadas para percorrer dados com for/while, fazer busca e ordenação, simular estruturas como pilha (LIFO: último a entrar, primeiro a sair) e fila (FIFO: primeiro a entrar, primeiro a sair), e pensar no custo de operações.</div></section>

ction="next" data-id="${l.id}">Próxima aula →</button></div></div><aside class="aside"><section class="card"><div class="eyebrow">Seu progresso</div><h2>${done}/${l.questions.length}</h2><p class="muted small">atividades respondidas corretamente</p><div class="progress"><span style="width:${Math.round(done/l.questions.length*100)}%"></span></div><div class="callout green">${allDone(l)?'🎉 Você concluiu esta aula!':'Faça as atividades para concluir a aula.'}</div><button class="btn primary" style="width:100%" data-action="finish" data-id="${l.id}" ${allDone(l)?'':'disabled'}>${allDone(l)?'Marcar aula concluída':'Conclua as atividades'}</button></section><section class="card"><h3>💚 Lembrete</h3><p class="small muted">Errar faz parte do estudo. Leia a explicação, volte ao exemplo e tente outra vez.</p><button class="btn outline" style="width:100%" data-action="zero">Ver caminho do zero</button></section></aside></div></div>`;startCoach('lesson')}

function methodTable(){return `<div class="callout">Esta é a lista de métodos que aparece na Aula 11 que você enviou.</div><div class="tablewrap"><table class="methodtable"><tr><th>Comando</th><th>O que faz</th></tr><tr><td><code>append(item)</code></td><td>Adiciona no final.</td></tr><tr><td><code>insert(i, item)</code></td><td>Insere na posição indicada.</td></tr><tr><td><code>extend(lista)</code></td><td>Adiciona os itens de outra coleção.</td></tr><tr><td><code>pop(i)</code></td><td>Remove e devolve o item; sem índice, remove o último.</td></tr><tr><td><code>remove(item)</code></td><td>Remove a primeira ocorrência do valor.</td></tr><tr><td><code>clear()</code></td><td>Remove todos os itens.</td></tr><tr><td><code>lista[i] / lista[-1]</code></td><td>Acessa posição; -1 é o último.</td></tr><tr><td><code>index(item)</code></td><td>Devolve o índice da primeira ocorrência.</td></tr><tr><td><code>count(item)</code></td><td>Conta quantas vezes aparece.</td></tr><tr><td><code>sort()</code></td><td>Ordena em ordem crescente.</td></tr><tr><td><code>sort(reverse=True)</code></td><td>Ordena em ordem decrescente.</td></tr><tr><td><code>reverse()</code></td><td>Inverte a ordem atual.</td></tr><tr><td><code>len(lista)</code></td><td>Conta os elementos.</td></tr><tr><td><code>copy()</code></td><td>Cria uma cópia superficial.</td></tr><tr><td><code>min() / max()</code></td><td>Menor / maior valor.</td></tr><tr><td><code>sum(lista)</code></td><td>Soma elementos numéricos.</td></tr><tr><td><code>lista[a:b]</code></td><td>Fatia; b não é incluído.</td></tr><tr><td><code>lista[::-1]</code></td><td>Devolve os elementos em ordem inversa.</td></tr></table></div>`}

function dailyQuiz(q,i,done){return `<article class="quiz" data-daily="${i}"><h3>Questão ${i+1}. ${q.q}</h3>${q.code?`<pre class="code">${esc(q.code)}</pre>`:''}<div class="options">${q.o.map((o,j)=>`<button class="opt" data-action="daily-choose" data-i="${i}" data-choice="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div><div class="feedback hidden" id="dailyfb-${i}"></div></article>`}
function dailyFinish(){const set=dailySetForToday(),date=new Date().toLocaleDateString('pt-BR');if(Object.keys(dailySelection).filter(k=>/^\d+$/.test(k)).length!==set.questions.length){toast('Responda às três questões antes de conferir.');return}let hits=0;set.questions.forEach((q,i)=>{const ok=dailySelection[i]===q.a;if(ok){hits++;if(!(state.dailyDone[date]||[]).includes(i))state.xp+=3}const fb=$(`#dailyfb-${i}`);fb.className='feedback '+(ok?'good':'bad');fb.textContent=(ok?'✅ Correto. ':'❌ Vamos revisar. ')+q.e;document.querySelectorAll(`[data-daily="${i}"] .opt`).forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===dailySelection[i]&&!ok)b.classList.add('wrong')})});state.dailyDone[date]=set.questions.map((q,i)=>i).filter(i=>dailySelection[i]===set.questions[i].a);persist();$('#dailyResult').classList.remove('hidden');$('#dailyResult').textContent=`Você acertou ${hits} de ${set.questions.length}. ${hits===3?'Excelente!':'Leia as explicações e tente revisar o assunto nas aulas.'}`;$('#dailyFinish').disabled=true}
